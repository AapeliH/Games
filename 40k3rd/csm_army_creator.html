<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaos Space Marines — Army Creator</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Roboto+Condensed:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blood:     #8B0000;
    --blood-dim: #5a0000;
    --steel:     #2a2a2a;
    --steel-mid: #333333;
    --steel-hi:  #444444;
    --base:      #141414;
    --parchment: #c9a96e;
    --parch-dim: #9a7a4a;
    --text:      #d4c5a9;
    --text-dim:  #7a6e5e;
    --border:    #3a3a3a;
    --gold:      #b8860b;
  }

  body {
    background: var(--base);
    color: var(--text);
    font-family: 'Roboto Condensed', sans-serif;
    font-weight: 400;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  header {
    background: var(--steel);
    border-bottom: 3px solid var(--blood);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: 1.4rem;
    letter-spacing: .08em;
    color: var(--blood);
    text-transform: uppercase;
  }
  header h1 span { color: var(--parchment); }
  .header-pts {
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    color: var(--parch-dim);
  }
  .header-pts strong { color: var(--parchment); font-size: 1.3rem; }

  /* ── LAYOUT ── */
  .app {
    display: grid;
    grid-template-columns: 320px 1fr;
    flex: 1;
    min-height: 0;
  }

  /* ── SIDEBAR ── */
  aside {
    background: var(--steel);
    border-right: 2px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    background: var(--steel-mid);
  }
  .sidebar-header h2 {
    font-family: 'Cinzel', serif;
    font-size: .75rem;
    letter-spacing: .15em;
    color: var(--parch-dim);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .search-box {
    width: 100%;
    background: var(--base);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    font-family: 'Roboto Condensed', sans-serif;
    font-size: .9rem;
  }
  .search-box::placeholder { color: var(--text-dim); }
  .search-box:focus { outline: none; border-color: var(--blood); }

  .role-group { border-bottom: 1px solid var(--border); }
  .role-label {
    padding: 8px 16px;
    font-family: 'Cinzel', serif;
    font-size: .65rem;
    letter-spacing: .2em;
    color: var(--blood);
    text-transform: uppercase;
    background: var(--steel-mid);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    user-select: none;
  }
  .role-label:hover { background: var(--steel-hi); }
  .role-label .chevron { transition: transform .2s; font-size: .7rem; }
  .role-label.collapsed .chevron { transform: rotate(-90deg); }
  .unit-list { overflow: hidden; }
  .unit-list.collapsed { display: none; }

  .unit-entry {
    padding: 10px 16px;
    cursor: pointer;
    border-bottom: 1px solid #222;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background .15s;
  }
  .unit-entry:hover { background: var(--steel-hi); }
  .unit-entry .uname {
    font-size: .9rem;
    color: var(--text);
    line-height: 1.2;
  }
  .unit-entry .uname small {
    display: block;
    font-size: .72rem;
    color: var(--text-dim);
    margin-top: 1px;
  }
  .unit-entry .add-btn {
    background: var(--blood-dim);
    border: 1px solid var(--blood);
    color: var(--parchment);
    width: 26px; height: 26px;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background .15s;
  }
  .unit-entry .add-btn:hover { background: var(--blood); }

  .sidebar-scroll { overflow-y: auto; flex: 1; }
  .sidebar-scroll::-webkit-scrollbar { width: 6px; }
  .sidebar-scroll::-webkit-scrollbar-track { background: var(--steel); }
  .sidebar-scroll::-webkit-scrollbar-thumb { background: var(--blood-dim); }

  /* ── MAIN ── */
  main {
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  main::-webkit-scrollbar { width: 6px; }
  main::-webkit-scrollbar-track { background: var(--base); }
  main::-webkit-scrollbar-thumb { background: var(--blood-dim); }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    gap: 12px;
    padding: 60px 0;
  }
  .empty-state .skull { font-size: 3rem; opacity: .3; }
  .empty-state p {
    font-family: 'Cinzel', serif;
    font-size: .85rem;
    letter-spacing: .1em;
    text-align: center;
  }

  /* ── UNIT CARD ── */
  .unit-card {
    background: var(--steel);
    border: 1px solid var(--border);
    border-left: 4px solid var(--blood);
    animation: slideIn .2s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: var(--steel-mid);
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }
  .card-title {
    font-family: 'Cinzel', serif;
    font-size: .95rem;
    font-weight: 700;
    color: var(--parchment);
    flex: 1;
  }
  .card-role {
    font-size: .65rem;
    color: var(--blood);
    letter-spacing: .15em;
    text-transform: uppercase;
    font-family: 'Cinzel', serif;
  }
  .card-pts-display {
    font-family: 'Cinzel', serif;
    font-size: .85rem;
    color: var(--parch-dim);
    white-space: nowrap;
  }
  .card-pts-display strong { color: var(--parchment); }

  .remove-btn {
    background: none;
    border: 1px solid #4a2020;
    color: #6a3030;
    width: 26px; height: 26px;
    cursor: pointer;
    font-size: .85rem;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
    flex-shrink: 0;
  }
  .remove-btn:hover { border-color: var(--blood); color: #ff4444; background: #2a0000; }

  /* ── STAT BAR ── */
  .stat-bar {
    display: flex;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .stat-cell {
    flex: 1;
    min-width: 36px;
    padding: 6px 4px;
    text-align: center;
    border-right: 1px solid var(--border);
  }
  .stat-cell:last-child { border-right: none; }
  .stat-label {
    font-size: .6rem;
    color: var(--text-dim);
    letter-spacing: .1em;
    text-transform: uppercase;
    display: block;
    margin-bottom: 2px;
  }
  .stat-value {
    font-size: .95rem;
    font-weight: 700;
    color: var(--parchment);
    display: block;
  }

  /* ── UNIT SIZE ── */
  .unit-controls {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .size-control {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: .8rem;
    color: var(--text-dim);
  }
  .size-control label { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; }
  .qty-btn {
    background: var(--steel-hi);
    border: 1px solid var(--border);
    color: var(--parchment);
    width: 22px; height: 22px;
    cursor: pointer;
    font-size: .9rem;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s;
  }
  .qty-btn:hover { background: var(--blood-dim); border-color: var(--blood); }
  .qty-btn:disabled { opacity: .3; cursor: default; }
  .qty-display {
    font-weight: 700;
    color: var(--parchment);
    font-size: .95rem;
    min-width: 24px;
    text-align: center;
  }

  /* ── WARGEAR ── */
  .wargear-section { padding: 10px 14px 12px; }
  .wargear-title {
    font-size: .65rem;
    letter-spacing: .15em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 8px;
    font-family: 'Cinzel', serif;
  }
  .wargear-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .gear-chip {
    display: flex;
    align-items: center;
    gap: 5px;
    background: var(--base);
    border: 1px solid var(--border);
    padding: 4px 8px;
    font-size: .78rem;
    color: var(--text);
    cursor: pointer;
    transition: all .15s;
    user-select: none;
  }
  .gear-chip:hover { border-color: var(--parch-dim); }
  .gear-chip.active {
    background: #1a0a0a;
    border-color: var(--blood);
    color: var(--parchment);
  }
  .gear-chip .gear-pts {
    color: var(--text-dim);
    font-size: .7rem;
  }
  .gear-chip.active .gear-pts { color: var(--parch-dim); }
  .gear-chip .gear-check { color: var(--blood); font-size: .75rem; }

  /* ── FORCE ORG SUMMARY ── */
  .force-org {
    background: var(--steel);
    border: 1px solid var(--border);
    padding: 14px 16px;
  }
  .force-org h3 {
    font-family: 'Cinzel', serif;
    font-size: .7rem;
    letter-spacing: .18em;
    color: var(--parch-dim);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .org-slots {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .org-slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-width: 60px;
  }
  .org-label {
    font-size: .6rem;
    color: var(--text-dim);
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  .org-pips {
    display: flex;
    gap: 3px;
  }
  .pip {
    width: 10px; height: 10px;
    border: 1px solid var(--border);
    background: var(--base);
  }
  .pip.filled { background: var(--blood); border-color: var(--blood); }
  .pip.over { background: #ff2200; border-color: #ff4400; }
</style>
</head>
<body>

<header>
  <h1>Chaos <span>Space Marines</span> — Army Creator</h1>
  <div class="header-pts">Total: <strong id="totalPts">0</strong> pts</div>
</header>

<div class="app">
  <aside>
    <div class="sidebar-header">
      <h2>Add Units</h2>
      <input class="search-box" type="text" id="searchBox" placeholder="Search units…" oninput="filterUnits()">
    </div>
    <div class="sidebar-scroll" id="unitBrowser"></div>
  </aside>
  <main id="rosterArea">
    <div class="empty-state" id="emptyState">
      <div class="skull">☠</div>
      <p>The Roster Awaits<br>Select units from the left to begin</p>
    </div>
    <div id="forceOrgBar" style="display:none"></div>
    <div id="roster"></div>
  </main>
</div>

<script>
// ═══════════════════════════════════════════════════════
// DATA  —  loaded from csm_data.json
// ═══════════════════════════════════════════════════════
let UNITS = [];


const ROLES = ["HQ","Elites","Troops","Fast Attack","Heavy Support"];
const ORG_LIMITS = { HQ:[1,2], Elites:[0,3], Troops:[2,6], "Fast Attack":[0,3], "Heavy Support":[0,3] };

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
let roster = []; // { uid, unitId, count, activeGear:{gearName:bool} }
let uidCounter = 0;

// ═══════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════
function getUnit(id) { return UNITS.find(u => u.id === id); }

function unitCost(entry) {
  const u = getUnit(entry.unitId);
  let gear = 0;
  Object.entries(entry.activeGear).forEach(([name, on]) => {
    if (on) {
      const g = u.wargear.find(w => w.name === name);
      if (g) gear += g.pts;
    }
  });
  const extra = Math.max(0, entry.count - u.minSize) * u.addPts;
  return u.pts + extra + gear;
}

function totalPts() { return roster.reduce((s, e) => s + unitCost(e), 0); }

function roleCount(role) { return roster.filter(e => getUnit(e.unitId).role === role).length; }

// ═══════════════════════════════════════════════════════
// SIDEBAR
// ═══════════════════════════════════════════════════════
function buildSidebar() {
  const browser = document.getElementById('unitBrowser');
  browser.innerHTML = '';
  const query = document.getElementById('searchBox').value.toLowerCase();

  ROLES.forEach(role => {
    const units = UNITS.filter(u => u.role === role && u.name.toLowerCase().includes(query));
    if (!units.length) return;

    const group = document.createElement('div');
    group.className = 'role-group';

    const label = document.createElement('div');
    label.className = 'role-label';
    label.innerHTML = `${role} <span class="chevron">▾</span>`;
    label.onclick = () => {
      label.classList.toggle('collapsed');
      list.classList.toggle('collapsed');
    };

    const list = document.createElement('div');
    list.className = 'unit-list';

    units.forEach(u => {
      const entry = document.createElement('div');
      entry.className = 'unit-entry';
      const sizeNote = u.maxSize > 1 ? `${u.minSize}–${u.maxSize} models` : 'Single model';
      entry.innerHTML = `
        <div class="uname">${u.name}<small>${u.pts} pts · ${sizeNote}</small></div>
        <button class="add-btn" onclick="addUnit('${u.id}')">+</button>
      `;
      list.appendChild(entry);
    });

    group.appendChild(label);
    group.appendChild(list);
    browser.appendChild(group);
  });
}

function filterUnits() { buildSidebar(); }

// ═══════════════════════════════════════════════════════
// ROSTER ACTIONS
// ═══════════════════════════════════════════════════════
function addUnit(unitId) {
  const u = getUnit(unitId);
  const defaultGear = {};
  u.wargear.forEach(g => { if (g.default) defaultGear[g.name] = true; });
  roster.push({ uid: uidCounter++, unitId, count: u.minSize, activeGear: defaultGear });
  renderRoster();
}

function removeUnit(uid) {
  roster = roster.filter(e => e.uid !== uid);
  renderRoster();
}

function changeCount(uid, delta) {
  const entry = roster.find(e => e.uid === uid);
  const u = getUnit(entry.unitId);
  entry.count = Math.min(u.maxSize, Math.max(u.minSize, entry.count + delta));
  renderRoster();
}

function toggleGear(uid, gearName) {
  const entry = roster.find(e => e.uid === uid);
  entry.activeGear[gearName] = !entry.activeGear[gearName];
  renderRoster();
}

// ═══════════════════════════════════════════════════════
// RENDER ROSTER
// ═══════════════════════════════════════════════════════
function renderRoster() {
  document.getElementById('totalPts').textContent = totalPts();
  document.getElementById('emptyState').style.display = roster.length ? 'none' : 'flex';

  const orgBar = document.getElementById('forceOrgBar');
  orgBar.style.display = roster.length ? 'block' : 'none';

  if (roster.length) {
    orgBar.innerHTML = `<div class="force-org">
      <h3>Force Organisation</h3>
      <div class="org-slots">
        ${ROLES.map(role => {
          const [min, max] = ORG_LIMITS[role];
          const count = roleCount(role);
          const pips = Array.from({length: max || 1}, (_, i) => {
            const filled = i < count;
            const over = filled && count > max;
            return `<div class="pip ${filled ? (over ? 'over' : 'filled') : ''}"></div>`;
          }).join('');
          const warn = count < min ? ' ⚠' : '';
          return `<div class="org-slot">
            <div class="org-label">${role}${warn}</div>
            <div class="org-pips">${pips}</div>
            <div class="org-label" style="color:var(--parchment)">${count}/${max}</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  const rosterEl = document.getElementById('roster');
  rosterEl.innerHTML = '';

  ROLES.forEach(role => {
    const entries = roster.filter(e => getUnit(e.unitId).role === role);
    entries.forEach(entry => {
      const u = getUnit(entry.unitId);
      const cost = unitCost(entry);
      const statKeys = ['WS','BS','S','T','W','I','A','Ld','Sv'];

      const card = document.createElement('div');
      card.className = 'unit-card';
      card.innerHTML = `
        <div class="card-header">
          <div>
            <div class="card-role">${u.role}</div>
            <div class="card-title">${u.name}</div>
          </div>
          <div class="card-pts-display"><strong>${cost}</strong> pts</div>
          <button class="remove-btn" onclick="removeUnit(${entry.uid})">✕</button>
        </div>
        <div class="stat-bar">
          ${statKeys.map(k => `
            <div class="stat-cell">
              <span class="stat-label">${k}</span>
              <span class="stat-value">${u.stats[k] ?? '—'}</span>
            </div>`).join('')}
        </div>
        ${u.maxSize > 1 ? `
        <div class="unit-controls">
          <div class="size-control">
            <label>Models</label>
            <button class="qty-btn" onclick="changeCount(${entry.uid},-1)" ${entry.count <= u.minSize ? 'disabled' : ''}>−</button>
            <span class="qty-display">${entry.count}</span>
            <button class="qty-btn" onclick="changeCount(${entry.uid},1)" ${entry.count >= u.maxSize ? 'disabled' : ''}>+</button>
          </div>
          ${u.addPts > 0 ? `<span style="font-size:.75rem;color:var(--text-dim)">${u.addPts} pts/additional model</span>` : ''}
        </div>` : ''}
        ${u.wargear.length ? `
        <div class="wargear-section">
          <div class="wargear-title">Wargear &amp; Options</div>
          <div class="wargear-grid">
            ${u.wargear.map(g => {
              const active = !!entry.activeGear[g.name];
              return `<div class="gear-chip ${active ? 'active' : ''}" onclick="toggleGear(${entry.uid},'${g.name.replace(/'/g,"\\'")}')">
                ${active ? '<span class="gear-check">✓</span>' : ''}
                ${g.name}
                ${g.pts > 0 ? `<span class="gear-pts">+${g.pts}</span>` : ''}
              </div>`;
            }).join('')}
          </div>
        </div>` : ''}
      `;
      rosterEl.appendChild(card);
    });
  });
}

// ═══════════════════════════════════════════════════════
// INIT  —  fetch unit data from csm_data.json
// ═══════════════════════════════════════════════════════
async function init() {
  try {
    const res = await fetch('csm_data.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    UNITS = data.units;
  } catch (err) {
    // Fallback notice if file isn't served (e.g. opened directly from disk)
    document.getElementById('unitBrowser').innerHTML =
      `<div style="padding:20px;color:#c0392b;font-size:.85rem;line-height:1.6">
        <strong>Could not load csm_data.json</strong><br>
        Make sure both files are served from the same folder via a local web server.<br><br>
        <em>Tip: run <code>python3 -m http.server</code> in the folder, then open<br>
        http://localhost:8000/csm_army_creator.html</em>
      </div>`;
    return;
  }
  buildSidebar();
  renderRoster();
}

init();
</script>
</body>
</html>
