<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Yatzy Scorecard</title>

<style>
    * {
        box-sizing: border-box;
    }

    :root {
        --bg: #f4f5f7;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #d1d5db;
        --accent: #2563eb;
        --accent-light: #dbeafe;
        --green: #16a34a;
        --green-light: #dcfce7;
        --dark: #111827;
        --danger: #B0001B;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        padding: 0 0 165px;

        font-family:
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

        background: var(--bg);
        color: var(--text);
    }

    .app {
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        padding: 14px;
    }

    /* =========================================
       HEADER
       ========================================= */

    header {
        text-align: center;
        margin-bottom: 14px;
    }

    .game-toggle {
        display: flex;

        background: #e5e7eb;
        border-radius: 12px;
        padding: 4px;

        max-width: 440px;
        margin: 0 auto;
    }

    .game-toggle button {
        flex: 1;

        border: 0;
        padding: 11px 8px;

        border-radius: 9px;

        background: transparent;
        color: var(--muted);

        font-size: 14px;
        font-weight: 700;

        cursor: pointer;
    }

    .game-toggle button.active {
        background: white;
        color: var(--accent);

        box-shadow:
            0 1px 4px rgba(0, 0, 0, .12);
    }

    /* =========================================
       PLAYER CONTROLS
       ========================================= */

    .header-actions {
        display: flex;

        align-items: center;
        justify-content: center;

        gap: 8px;

        margin-top: 10px;
    }

    .player-control {
        display: flex;

        align-items: center;

        background: white;

        border: 1px solid var(--border);
        border-radius: 10px;

        overflow: hidden;
    }

    .player-control-label {
        padding: 0 9px;

        font-size: 12px;
        font-weight: 700;

        color: var(--muted);
    }

    .player-count {
        min-width: 28px;

        text-align: center;

        font-size: 15px;
        font-weight: 800;

        color: var(--text);
    }

    .player-control-button {
        width: 34px;
        height: 34px;

        border: 0;

        background: white;
        color: var(--dark);

        font-size: 21px;
        font-weight: 800;

        line-height: 1;

        cursor: pointer;
    }

    .player-control-button:hover {
        background: #f3f4f6;
    }

    .player-control-button:active {
        transform: scale(.94);
    }

    .player-control-button:disabled {
        opacity: .3;
        cursor: default;
        transform: none;
    }

    .reset-button {
        border: 0;
        border-radius: 9px;

        padding: 8px 13px;

        background: var(--danger);
        color: white;

        font-size: 13px;
        font-weight: 700;

        cursor: pointer;
    }

    .reset-button:active {
        transform: scale(.97);
    }

    /* =========================================
       SCORECARD
       ========================================= */

    .scorecard {
        width: 100%;

        background: var(--card);

        border-radius: 14px;
        overflow: hidden;

        border: 1px solid var(--border);

        box-shadow:
            0 2px 8px rgba(0, 0, 0, .05);
    }

    .score-row {
        display: grid;

        min-height: 47px;

        border-bottom: 1px solid var(--border);
    }

    .score-row:last-child {
        border-bottom: 0;
    }

    .score-row > div {
        display: flex;

        align-items: center;
        justify-content: center;

        padding: 7px;

        min-width: 0;
    }

    .score-row > div:first-child {
        justify-content: flex-start;
    }

    /*
     * Player names are now part of the
     * upper-section row.
     */

    .section-row {
        background: #f3f4f6;

        font-size: 13px;
        font-weight: 800;

        color: #4b5563;

        text-transform: uppercase;
        letter-spacing: .04em;
    }

    .player-name-input {
        width: 100%;

        border: 0;
        outline: none;

        background: transparent;

        color: #374151;

        text-align: center;

        font: inherit;
        font-weight: 800;

        min-width: 0;
    }

    .player-name-input:focus {
        background: white;

        border-radius: 6px;

        box-shadow:
            0 0 0 2px var(--accent-light);
    }

    .score-label {
        font-size: 14px;
        line-height: 1.2;
    }

    .score-input {
        width: 60px;
        height: 36px;

        border: 1px solid var(--border);
        border-radius: 8px;

        text-align: center;

        font-size: 16px;
        font-weight: 700;

        outline: none;

        background: white;
    }

    .score-input:focus {
        border-color: var(--accent);

        box-shadow:
            0 0 0 2px var(--accent-light);
    }

    .calculated {
        font-weight: 700;
        color: var(--muted);
    }

    .bonus {
        color: var(--green);
    }

    .total-row {
        background: var(--dark);
        color: white;

        font-weight: 800;
        font-size: 18px;
    }

    .total-row .calculated {
        color: white;
    }

    .winner {
        background: var(--green-light);
        color: #166534 !important;
    }

    .hidden {
        display: none;
    }

    /* =========================================
       STICKY BOTTOM BAR
       ========================================= */

    .sticky-bar {
        position: fixed;

        left: 0;
        right: 0;
        bottom: 0;

        z-index: 1000;

        padding:
            8px
            max(8px, env(safe-area-inset-right))
            calc(8px + env(safe-area-inset-bottom))
            max(8px, env(safe-area-inset-left));

        background: rgba(17, 24, 39, .97);

        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);

        box-shadow:
            0 -4px 16px rgba(0, 0, 0, .18);
    }

    .sticky-inner {
        width: 100%;
        max-width: 1100px;

        margin: 0 auto;

        display: grid;

        gap: 1px;

        background: #4b5563;

        border-radius: 12px;
        overflow: hidden;
    }

    .player-status {
        min-width: 0;

        background: var(--dark);
        color: white;

        padding: 8px 10px;
    }

    .player-status-header {
        display: flex;

        align-items: center;
        justify-content: space-between;

        gap: 6px;

        margin-bottom: 5px;
    }

    .player-name-small {
        font-size: 12px;
        font-weight: 800;

        text-transform: uppercase;
        letter-spacing: .05em;

        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .score-title {
        color: #cbd5e1;

        font-size: 9px;

        text-transform: uppercase;
        letter-spacing: .08em;

        font-weight: 800;
    }

    .total-score {
        font-size: 26px;

        line-height: 1;

        font-weight: 900;
    }

    /* =========================================
       RE-ROLL CONTROLS
       ========================================= */

    .reroll-area {
        display: flex;

        align-items: center;
        justify-content: space-between;

        gap: 6px;

        margin-top: 7px;
        padding-top: 7px;

        border-top: 1px solid #374151;
    }

    .reroll-label {
        color: #cbd5e1;

        font-size: 9px;

        text-transform: uppercase;
        letter-spacing: .08em;

        font-weight: 800;
    }

    .reroll-controls {
        display: flex;

        align-items: center;

        gap: 5px;
    }

    .reroll-number {
        min-width: 25px;

        text-align: center;

        font-size: 17px;
        font-weight: 900;
    }

    .reroll-button {
        width: 29px;
        height: 29px;

        padding: 0;

        border: 0;
        border-radius: 7px;

        background: white;
        color: var(--dark);

        font-size: 19px;
        font-weight: 900;

        cursor: pointer;

        line-height: 1;
    }

    .reroll-button:active {
        transform: scale(.94);
    }

    .reroll-button:disabled {
        opacity: .4;
    }

    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 700px) {

        .app {
            padding: 10px;
        }

        .score-label {
            font-size: 13px;
        }

        .score-input {
            width: 52px;
            height: 34px;
        }

        .player-name-input {
            font-size: 12px;
        }

        .total-row {
            font-size: 16px;
        }

        .player-status {
            padding: 7px 8px;
        }

        .player-name-small {
            font-size: 11px;
        }

        .total-score {
            font-size: 22px;
        }
    }

    @media (max-width: 500px) {

        .header-actions {
            flex-wrap: wrap;
        }

        .score-row > div {
            padding: 5px 3px;
        }

        .score-label {
            font-size: 12px;
        }

        .score-input {
            width: 48px;
        }

        .player-control-label {
            display: none;
        }

        .player-control-button {
            width: 32px;
            height: 32px;
        }

        .player-count {
            min-width: 24px;
        }

        .reset-button {
            padding: 7px 11px;
        }

        .total-score {
            font-size: 20px;
        }

        .reroll-button {
            width: 26px;
            height: 26px;
        }

        .reroll-label {
            display: none;
        }

        .player-status {
            padding: 6px;
        }
    }
</style>
</head>


<body>

<div class="app">

    <header>

        <div class="game-toggle">

            <button
                id="yatzyBtn"
                class="active"
                type="button"
                onclick="setGame('yatzy')"
            >
                Yatzy · 5 Dice
            </button>

            <button
                id="maxBtn"
                type="button"
                onclick="setGame('max')"
            >
                Max Yatzy · 6 Dice
            </button>

        </div>


        <!-- =====================================
             PLAYER ADD / REMOVE
             ===================================== -->

        <div class="header-actions">

            <div class="player-control">

                <span class="player-control-label">
                    Players
                </span>

                <button
                    id="removePlayerButton"
                    class="player-control-button"
                    type="button"
                    onclick="removePlayer()"
                    aria-label="Remove player"
                >
                    −
                </button>

                <span
                    id="playerCount"
                    class="player-count"
                >
                    2
                </span>

                <button
                    id="addPlayerButton"
                    class="player-control-button"
                    type="button"
                    onclick="addPlayer()"
                    aria-label="Add player"
                >
                    +
                </button>

            </div>


            <button
                class="reset-button"
                type="button"
                onclick="resetGame()"
            >
                ↻ Reset Game
            </button>

        </div>

    </header>


    <!-- =========================================
         NORMAL YATZY
         ========================================= -->

    <div
        id="yatzyCard"
        class="scorecard"
    >

        <!-- Player names are in Upper Section -->
        <div
            id="yatzyUpperSection"
            class="score-row section-row"
        ></div>


        <div
            id="yatzyUpperRows"
        ></div>


        <div
            id="yatzyUpperTotalRow"
            class="score-row"
        ></div>


        <div
            id="yatzyBonusRow"
            class="score-row"
        ></div>


        <div
            id="yatzyLowerSection"
            class="score-row section-row"
        ></div>


        <div
            id="yatzyLowerRows"
        ></div>


        <div
            id="yatzyTotalRow"
            class="score-row total-row"
        ></div>

    </div>


    <!-- =========================================
         MAX YATZY
         ========================================= -->

    <div
        id="maxCard"
        class="scorecard hidden"
    >

        <!-- Player names are in Upper Section -->
        <div
            id="maxUpperSection"
            class="score-row section-row"
        ></div>


        <div
            id="maxUpperRows"
        ></div>


        <div
            id="maxUpperTotalRow"
            class="score-row"
        ></div>


        <div
            id="maxBonusRow"
            class="score-row"
        ></div>


        <div
            id="maxLowerSection"
            class="score-row section-row"
        ></div>


        <div
            id="maxLowerRows"
        ></div>


        <div
            id="maxTotalRow"
            class="score-row total-row"
        ></div>

    </div>

</div>


<!-- =========================================
     STICKY BOTTOM BAR
     ========================================= -->

<div class="sticky-bar">

    <div
        id="stickyInner"
        class="sticky-inner"
    ></div>

</div>


<script>

/* =========================================
   CONFIGURATION
   ========================================= */

const MAX_PLAYERS = 4;

const MIN_PLAYERS = 2;


/*
 * Initial player names.
 *
 * These can be changed here if desired.
 */
const DEFAULT_PLAYERS = [
    "P1",
    "P2"
];


const DEFAULT_REROLLS = 0;


/* =========================================
   STORAGE KEYS
   ========================================= */

const STORAGE_KEY =
    "yatzyScorecardV6";

const GAME_KEY =
    "yatzyCurrentGame";

const PLAYERS_KEY =
    "yatzyPlayersV2";

const REROLLS_KEY =
    "maxYatzyRerollsV4";


/* =========================================
   CURRENT STATE
   ========================================= */

let currentGame =
    localStorage.getItem(
        GAME_KEY
    ) || "yatzy";


let players =
    loadPlayers();


let rerolls =
    loadRerolls();


/* =========================================
   CATEGORIES
   ========================================= */

const upperCategories = [

    {
        key: "ones",
        label: "Ones"
    },

    {
        key: "twos",
        label: "Twos"
    },

    {
        key: "threes",
        label: "Threes"
    },

    {
        key: "fours",
        label: "Fours"
    },

    {
        key: "fives",
        label: "Fives"
    },

    {
        key: "sixes",
        label: "Sixes"
    }

];


const yatzyLowerCategories = [

    {
        key: "pair",
        label: "One Pair"
    },

    {
        key: "twoPairs",
        label: "Two Pairs"
    },

    {
        key: "threeKind",
        label: "Three of a Kind"
    },

    {
        key: "fourKind",
        label: "Four of a Kind"
    },

    {
        key: "fullHouse",
        label: "Full House"
    },

    {
        key: "smallStraight",
        label: "Small Straight"
    },

    {
        key: "largeStraight",
        label: "Large Straight"
    },

    {
        key: "chance",
        label: "Chance"
    },

    {
        key: "yatzy",
        label: "Yatzy (50)"
    }

];


const maxLowerCategories = [

    {
        key: "pair",
        label: "One Pair"
    },

    {
        key: "twoPairs",
        label: "Two Pairs"
    },

    {
        key: "threePairs",
        label: "Three Pairs"
    },

    {
        key: "threeKind",
        label: "Three of a Kind"
    },

    {
        key: "fourKind",
        label: "Four of a Kind"
    },

    {
        key: "fiveKind",
        label: "Five of a Kind"
    },

    {
        key: "smallStraight",
        label: "Small Straight"
    },

    {
        key: "largeStraight",
        label: "Large Straight"
    },

    {
        key: "fullStraight",
        label: "Full Straight"
    },

    {
        key: "fullHouse",
        label: "Full House"
    },

    {
        key: "talo",
        label: "Four of a Kind + Pair"
    },

    {
        key: "sauna",
        label: "Two Three of a Kinds"
    },

    {
        key: "chance",
        label: "Chance"
    },

    {
        key: "yatzy",
        label: "Yatzy (100)"
    }

];


/* =========================================
   GRID
   ========================================= */

function getGridTemplate() {

    return `
        minmax(150px, 1fr)
        repeat(
            ${players.length},
            minmax(58px, 1fr)
        )
    `.replace(/\s+/g, " ").trim();
}


/*
 * Apply the current number of player columns
 * to every score row.
 */
function updateGridColumns() {

    const template =
        getGridTemplate();


    document
        .querySelectorAll(".score-row")
        .forEach(row => {

            row.style.gridTemplateColumns =
                template;
        });
}


/* =========================================
   PLAYER STORAGE
   ========================================= */

function loadPlayers() {

    const saved =
        localStorage.getItem(
            PLAYERS_KEY
        );


    if (!saved) {

        return [
            ...DEFAULT_PLAYERS
        ];
    }


    try {

        const loaded =
            JSON.parse(saved);


        if (
            !Array.isArray(loaded) ||
            loaded.length < MIN_PLAYERS
        ) {

            return [
                ...DEFAULT_PLAYERS
            ];
        }


        const result =
            loaded
                .slice(
                    0,
                    MAX_PLAYERS
                )
                .map(
                    (name, index) =>
                        String(
                            name ||
                            `P${index + 1}`
                        )
                );


        while (
            result.length < MIN_PLAYERS
        ) {

            result.push(
                `P${result.length + 1}`
            );
        }


        return result;


    } catch {

        return [
            ...DEFAULT_PLAYERS
        ];
    }
}


function savePlayers() {

    localStorage.setItem(
        PLAYERS_KEY,
        JSON.stringify(players)
    );
}


/* =========================================
   ADD PLAYER
   ========================================= */

function addPlayer() {

    if (
        players.length >= MAX_PLAYERS
    ) {
        return;
    }


    const newPlayerNumber =
        players.length + 1;


    players.push(
        `P${newPlayerNumber}`
    );


    rerolls[players.length] =
        DEFAULT_REROLLS;


    savePlayers();

    saveRerolls();


    rebuildScorecards();

    rebuildStickyBar();


    loadScoresForGame(
        currentGame
    );


    update();

    updatePlayerControls();
}


/* =========================================
   REMOVE PLAYER
   ========================================= */

function removePlayer() {

    if (
        players.length <= MIN_PLAYERS
    ) {
        return;
    }


    const removedPlayer =
        players.length;


    /*
     * Remove the last player.
     *
     * Existing saved scores for that
     * player are also removed so that
     * adding a new player later creates
     * a genuinely new player.
     */
    clearPlayerStorage(
        removedPlayer
    );


    players.pop();


    delete rerolls[
        removedPlayer
    ];


    savePlayers();

    saveRerolls();


    rebuildScorecards();

    rebuildStickyBar();


    loadScoresForGame(
        currentGame
    );


    update();

    updatePlayerControls();
}


/*
 * Remove stored scores for one player.
 */
function clearPlayerStorage(
    playerNumber
) {

    const data =
        getStoredData();


    ["yatzy", "max"]
        .forEach(game => {

            if (!data[game]) {
                return;
            }


            const suffix =
                "_" + playerNumber;


            Object.keys(
                data[game]
            ).forEach(key => {

                if (
                    key.endsWith(
                        suffix
                    )
                ) {

                    delete data[game][key];
                }
            });
        });


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );
}


/* =========================================
   PLAYER NAME EDITING
   ========================================= */

function updatePlayerName(
    playerIndex,
    newName
) {

    const cleaned =
        newName.trim();


    if (!cleaned) {

        players[playerIndex] =
            `P${playerIndex + 1}`;

    } else {

        players[playerIndex] =
            cleaned;
    }


    savePlayers();

    updatePlayerNames();

    rebuildStickyBar();

    update();
}


function updatePlayerNames() {

    document
        .querySelectorAll(
            ".player-name-input"
        )
        .forEach(
            (input, index) => {

                if (
                    players[index] !== undefined
                ) {

                    input.value =
                        players[index];
                }
            }
        );
}


/* =========================================
   PLAYER CONTROL UI
   ========================================= */

function updatePlayerControls() {

    document.getElementById(
        "playerCount"
    ).textContent =
        players.length;


    document.getElementById(
        "removePlayerButton"
    ).disabled =
        players.length <= MIN_PLAYERS;


    document.getElementById(
        "addPlayerButton"
    ).disabled =
        players.length >= MAX_PLAYERS;
}


/* =========================================
   RE-ROLL STORAGE
   ========================================= */

function loadRerolls() {

    const saved =
        localStorage.getItem(
            REROLLS_KEY
        );


    const defaults = {};


    for (
        let i = 1;
        i <= MAX_PLAYERS;
        i++
    ) {

        defaults[i] =
            DEFAULT_REROLLS;
    }


    if (!saved) {
        return defaults;
    }


    try {

        const data =
            JSON.parse(saved);


        for (
            let i = 1;
            i <= MAX_PLAYERS;
            i++
        ) {

            const value =
                Number(
                    data[i]
                );


            defaults[i] =
                Number.isFinite(value)
                    ? Math.max(
                        0,
                        value
                    )
                    : DEFAULT_REROLLS;
        }


        return defaults;


    } catch {

        return defaults;
    }
}


function saveRerolls() {

    localStorage.setItem(
        REROLLS_KEY,
        JSON.stringify(rerolls)
    );
}


function changeRerolls(
    playerNumber,
    amount
) {

    rerolls[playerNumber] =
        Math.max(
            0,
            (
                rerolls[playerNumber] ||
                DEFAULT_REROLLS
            ) + amount
        );


    saveRerolls();

    updateRerollDisplay();
}


function updateRerollDisplay() {

    for (
        let player = 1;
        player <= players.length;
        player++
    ) {

        const element =
            document.getElementById(
                `rerolls${player}`
            );


        if (element) {

            element.textContent =
                rerolls[player] ??
                DEFAULT_REROLLS;
        }
    }
}


/* =========================================
   SCORE STORAGE
   ========================================= */

function getStoredData() {

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );


    if (!saved) {

        return {
            yatzy: {},
            max: {}
        };
    }


    try {

        const data =
            JSON.parse(saved);


        return {

            yatzy:
                data.yatzy || {},

            max:
                data.max || {}
        };


    } catch {

        return {
            yatzy: {},
            max: {}
        };
    }
}


function saveGame() {

    const data =
        getStoredData();


    document
        .querySelectorAll(".score")
        .forEach(input => {

            const game =
                input.dataset.game;


            const key =
                input.dataset.cat +
                "_" +
                input.dataset.player;


            if (!data[game]) {
                data[game] = {};
            }


            data[game][key] =
                input.value;
        });


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );


    localStorage.setItem(
        GAME_KEY,
        currentGame
    );
}


function loadScoresForGame(
    game
) {

    const data =
        getStoredData();


    const scores =
        data[game] || {};


    document
        .querySelectorAll(
            `.score[data-game="${game}"]`
        )
        .forEach(input => {

            const key =
                input.dataset.cat +
                "_" +
                input.dataset.player;


            input.value =
                scores[key] !== undefined
                    ? scores[key]
                    : "";
        });
}


/* =========================================
   CREATE SCORE INPUT
   ========================================= */

function createInput(
    game,
    category,
    player
) {

    const input =
        document.createElement(
            "input"
        );


    input.className =
        "score-input score";


    input.type =
        "number";


    input.inputMode =
        "numeric";


    input.min =
        "0";


    input.step =
        "1";


    input.dataset.game =
        game;


    input.dataset.cat =
        category;


    input.dataset.player =
        player;


    return input;
}


/* =========================================
   CREATE SCORE ROW
   ========================================= */

function createScoreRow(
    game,
    category
) {

    const row =
        document.createElement(
            "div"
        );


    row.className =
        "score-row";


    row.style.gridTemplateColumns =
        getGridTemplate();


    const label =
        document.createElement(
            "div"
        );


    label.className =
        "score-label";


    label.textContent =
        category.label;


    row.appendChild(
        label
    );


    for (
        let player = 1;
        player <= players.length;
        player++
    ) {

        const cell =
            document.createElement(
                "div"
            );


        cell.appendChild(
            createInput(
                game,
                category.key,
                player
            )
        );


        row.appendChild(
            cell
        );
    }


    return row;
}


/* =========================================
   CREATE UPPER SECTION
   WITH PLAYER NAMES
   ========================================= */

function buildUpperSection(
    containerId
) {

    const row =
        document.getElementById(
            containerId
        );


    row.innerHTML =
        "";


    row.style.gridTemplateColumns =
        getGridTemplate();


    const sectionCell =
        document.createElement(
            "div"
        );


    sectionCell.textContent =
        "Upper Section";


    row.appendChild(
        sectionCell
    );


    players.forEach(
        (name, index) => {

            const cell =
                document.createElement(
                    "div"
                );


            const input =
                document.createElement(
                    "input"
                );


            input.className =
                "player-name-input";


            input.type =
                "text";


            input.value =
                name;


            input.placeholder =
                `P${index + 1}`;


            input.maxLength =
                20;


            input.setAttribute(
                "aria-label",
                `Player ${index + 1} name`
            );


            input.addEventListener(
                "change",
                () => {

                    updatePlayerName(
                        index,
                        input.value
                    );
                }
            );


            input.addEventListener(
                "blur",
                () => {

                    updatePlayerName(
                        index,
                        input.value
                    );
                }
            );


            cell.appendChild(
                input
            );


            row.appendChild(
                cell
            );
        }
    );
}


/* =========================================
   SECTION ROW
   ========================================= */

function buildSimpleSection(
    containerId,
    label
) {

    const row =
        document.getElementById(
            containerId
        );


    row.innerHTML =
        "";


    row.style.gridTemplateColumns =
        getGridTemplate();


    const labelCell =
        document.createElement(
            "div"
        );


    labelCell.textContent =
        label;


    row.appendChild(
        labelCell
    );


    for (
        let i = 0;
        i < players.length;
        i++
    ) {

        row.appendChild(
            document.createElement(
                "div"
            )
        );
    }
}


/* =========================================
   CALCULATED ROW
   ========================================= */

function buildCalculatedRow(
    id,
    label,
    prefix,
    isTotal = false
) {

    const row =
        document.getElementById(
            id
        );


    row.innerHTML =
        "";


    row.style.gridTemplateColumns =
        getGridTemplate();


    const labelCell =
        document.createElement(
            "div"
        );


    if (isTotal) {

        const strong =
            document.createElement(
                "strong"
            );


        strong.textContent =
            label;


        labelCell.appendChild(
            strong
        );

    } else {

        labelCell.textContent =
            label;
    }


    row.appendChild(
        labelCell
    );


    for (
        let player = 1;
        player <= players.length;
        player++
    ) {

        const cell =
            document.createElement(
                "div"
            );


        cell.id =
            `${prefix}${player}`;


        cell.className =
            "calculated";


        if (
            label === "Bonus"
        ) {

            cell.classList.add(
                "bonus"
            );
        }


        row.appendChild(
            cell
        );
    }
}


/* =========================================
   BUILD SCORECARDS
   ========================================= */

function rebuildScorecards() {

    /*
     * Clear dynamic rows.
     */
    [
        "yatzyUpperRows",
        "yatzyLowerRows",
        "maxUpperRows",
        "maxLowerRows"
    ]
    .forEach(id => {

        document.getElementById(
            id
        ).innerHTML = "";
    });


    /*
     * Upper section with player names.
     */
    buildUpperSection(
        "yatzyUpperSection"
    );


    buildUpperSection(
        "maxUpperSection"
    );


    /*
     * Lower section headers.
     */
    buildSimpleSection(
        "yatzyLowerSection",
        "Lower Section"
    );


    buildSimpleSection(
        "maxLowerSection",
        "Lower Section"
    );


    /*
     * Upper score rows.
     */
    upperCategories.forEach(
        category => {

            document
                .getElementById(
                    "yatzyUpperRows"
                )
                .appendChild(
                    createScoreRow(
                        "yatzy",
                        category
                    )
                );


            document
                .getElementById(
                    "maxUpperRows"
                )
                .appendChild(
                    createScoreRow(
                        "max",
                        category
                    )
                );
        }
    );


    /*
     * Yatzy lower section.
     */
    yatzyLowerCategories.forEach(
        category => {

            document
                .getElementById(
                    "yatzyLowerRows"
                )
                .appendChild(
                    createScoreRow(
                        "yatzy",
                        category
                    )
                );
        }
    );


    /*
     * Max Yatzy lower section.
     */
    maxLowerCategories.forEach(
        category => {

            document
                .getElementById(
                    "maxLowerRows"
                )
                .appendChild(
                    createScoreRow(
                        "max",
                        category
                    )
                );
        }
    );


    /*
     * Calculated rows.
     */

    buildCalculatedRow(
        "yatzyUpperTotalRow",
        "Upper Total",
        "yatzyUpper"
    );


    buildCalculatedRow(
        "yatzyBonusRow",
        "Bonus",
        "yatzyBonus"
    );


    buildCalculatedRow(
        "yatzyTotalRow",
        "🏆 TOTAL",
        "yatzyTotal",
        true
    );


    buildCalculatedRow(
        "maxUpperTotalRow",
        "Upper Total",
        "maxUpper"
    );


    buildCalculatedRow(
        "maxBonusRow",
        "Bonus",
        "maxBonus"
    );


    buildCalculatedRow(
        "maxTotalRow",
        "🏆 TOTAL",
        "maxTotal",
        true
    );


    updateGridColumns();
}


/* =========================================
   STICKY BOTTOM BAR
   ========================================= */

function rebuildStickyBar() {

    const container =
        document.getElementById(
            "stickyInner"
        );


    container.innerHTML =
        "";


    container.style.gridTemplateColumns =
        `repeat(
            ${players.length},
            minmax(0, 1fr)
        )`;


    for (
        let player = 1;
        player <= players.length;
        player++
    ) {

        const status =
            document.createElement(
                "div"
            );


        status.className =
            "player-status";


        status.innerHTML = `

            <div class="player-status-header">

                <span
                    id="stickyName${player}"
                    class="player-name-small"
                >
                    ${escapeHtml(
                        players[player - 1]
                    )}
                </span>

                <span class="score-title">
                    Total
                </span>

            </div>


            <div
                id="stickyTotal${player}"
                class="total-score"
            >
                0
            </div>


            <div
                id="rerollArea${player}"
                class="reroll-area hidden"
            >

                <span class="reroll-label">
                    Re-rolls
                </span>


                <div class="reroll-controls">

                    <button
                        class="reroll-button"
                        type="button"
                        onclick="changeRerolls(${player}, -1)"
                        aria-label="Use one re-roll"
                    >
                        −
                    </button>


                    <span
                        id="rerolls${player}"
                        class="reroll-number"
                    >
                        ${
                            rerolls[player] ??
                            DEFAULT_REROLLS
                        }
                    </span>


                    <button
                        class="reroll-button"
                        type="button"
                        onclick="changeRerolls(${player}, 1)"
                        aria-label="Add one re-roll"
                    >
                        +
                    </button>

                </div>

            </div>
        `;


        container.appendChild(
            status
        );
    }


    updateRerollVisibility();

    updateRerollDisplay();
}


function updateRerollVisibility() {

    for (
        let player = 1;
        player <= players.length;
        player++
    ) {

        const area =
            document.getElementById(
                `rerollArea${player}`
            );


        if (!area) {
            continue;
        }


        area.classList.toggle(
            "hidden",
            currentGame !== "max"
        );
    }
}


/* =========================================
   SCORE CALCULATION
   ========================================= */

function getScore(
    game,
    category,
    player
) {

    const input =
        document.querySelector(
            `.score[data-game="${game}"][data-cat="${category}"][data-player="${player}"]`
        );


    if (
        !input ||
        input.value === ""
    ) {

        return 0;
    }


    const value =
        Number(
            input.value
        );


    if (
        !Number.isFinite(value) ||
        value < 0
    ) {

        return 0;
    }


    return value;
}


function getUpperTotal(
    game,
    player
) {

    return upperCategories.reduce(
        (
            sum,
            category
        ) => {

            return (
                sum +
                getScore(
                    game,
                    category.key,
                    player
                )
            );

        },
        0
    );
}


/* =========================================
   YATZY CALCULATION
   ========================================= */

function updateYatzy() {

    const totals =
        Array(
            players.length
        ).fill(0);


    for (
        let player = 1;
        player <= players.length;
        player++
    ) {

        const upper =
            getUpperTotal(
                "yatzy",
                player
            );


        const bonus =
            upper >= 63
                ? 50
                : 0;


        document.getElementById(
            `yatzyUpper${player}`
        ).textContent =
            upper;


        document.getElementById(
            `yatzyBonus${player}`
        ).textContent =
            bonus;


        let total =
            upper + bonus;


        yatzyLowerCategories
            .forEach(category => {

                total +=
                    getScore(
                        "yatzy",
                        category.key,
                        player
                    );
            });


        totals[player - 1] =
            total;


        document.getElementById(
            `yatzyTotal${player}`
        ).textContent =
            total;
    }


    updateWinners(
        "yatzyTotal",
        totals
    );


    updateStickyTotals(
        totals
    );
}


/* =========================================
   MAX YATZY CALCULATION
   ========================================= */

function updateMax() {

    const totals =
        Array(
            players.length
        ).fill(0);


    for (
        let player = 1;
        player <= players.length;
        player++
    ) {

        const upper =
            getUpperTotal(
                "max",
                player
            );


        const bonus =
            upper >= 75
                ? 50
                : 0;


        document.getElementById(
            `maxUpper${player}`
        ).textContent =
            upper;


        document.getElementById(
            `maxBonus${player}`
        ).textContent =
            bonus;


        let total =
            upper + bonus;


        maxLowerCategories
            .forEach(category => {

                total +=
                    getScore(
                        "max",
                        category.key,
                        player
                    );
            });


        totals[player - 1] =
            total;


        document.getElementById(
            `maxTotal${player}`
        ).textContent =
            total;
    }


    updateWinners(
        "maxTotal",
        totals
    );


    updateStickyTotals(
        totals
    );
}


/* =========================================
   WINNER
   ========================================= */

function updateWinners(
    prefix,
    totals
) {

    for (
        let player = 1;
        player <= players.length;
        player++
    ) {

        const element =
            document.getElementById(
                `${prefix}${player}`
            );


        if (element) {

            element.classList.remove(
                "winner"
            );
        }
    }


    const highest =
        Math.max(
            ...totals
        );


    const leaders =
        totals.filter(
            score =>
                score === highest
        ).length;


    /*
     * Do not highlight on a tie.
     */
    if (
        leaders !== 1
    ) {
        return;
    }


    const winnerIndex =
        totals.indexOf(
            highest
        );


    const winnerElement =
        document.getElementById(
            `${prefix}${winnerIndex + 1}`
        );


    if (winnerElement) {

        winnerElement.classList.add(
            "winner"
        );
    }
}


/* =========================================
   STICKY TOTALS
   ========================================= */

function updateStickyTotals(
    totals
) {

    for (
        let player = 1;
        player <= players.length;
        player++
    ) {

        const element =
            document.getElementById(
                `stickyTotal${player}`
            );


        if (element) {

            element.textContent =
                totals[player - 1] ?? 0;
        }
    }
}


/* =========================================
   GAME SWITCH
   ========================================= */

function setGame(
    game
) {

    currentGame =
        game;


    const isMax =
        game === "max";


    document
        .getElementById(
            "yatzyBtn"
        )
        .classList.toggle(
            "active",
            !isMax
        );


    document
        .getElementById(
            "maxBtn"
        )
        .classList.toggle(
            "active",
            isMax
        );


    document
        .getElementById(
            "yatzyCard"
        )
        .classList.toggle(
            "hidden",
            isMax
        );


    document
        .getElementById(
            "maxCard"
        )
        .classList.toggle(
            "hidden",
            !isMax
        );


    loadScoresForGame(
        game
    );


    updateRerollVisibility();

    update();

    saveGame();
}


/* =========================================
   RESET GAME
   ========================================= */

function resetGame() {

    const confirmed =
        confirm(
            "Reset the current game?\n\n" +
            "All scores for the current game " +
            "will be cleared.\n" +
            "All re-roll counters will be " +
            "set to 0."
        );


    if (!confirmed) {
        return;
    }


    /*
     * Clear current game's scores.
     */
    document
        .querySelectorAll(
            `.score[data-game="${currentGame}"]`
        )
        .forEach(input => {

            input.value =
                "";
        });


    /*
     * Reset re-roll counters.
     */
    for (
        let player = 1;
        player <= players.length;
        player++
    ) {

        rerolls[player] =
            DEFAULT_REROLLS;
    }


    saveRerolls();

    updateRerollDisplay();

    saveGame();

    update();
}


/* =========================================
   GENERAL UPDATE
   ========================================= */

function update() {

    if (
        currentGame === "max"
    ) {

        updateMax();

    } else {

        updateYatzy();
    }


    updateRerollDisplay();

    updateRerollVisibility();

    updatePlayerControls();

    saveGame();
}


/* =========================================
   INPUT EVENTS
   ========================================= */

document.addEventListener(
    "input",
    event => {

        if (
            event.target.classList.contains(
                "score"
            )
        ) {

            update();
        }
    }
);


/* =========================================
   ESCAPE HTML
   ========================================= */

function escapeHtml(
    value
) {

    return String(
        value
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );
}


/* =========================================
   START
   ========================================= */

rebuildScorecards();

rebuildStickyBar();

loadScoresForGame(
    currentGame
);

setGame(
    currentGame
);

updatePlayerControls();

updateRerollDisplay();

</script>

</body>
</html>
