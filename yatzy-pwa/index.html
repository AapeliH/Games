<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Yatzy Scorecard</title>

<style>
    * {
        box-sizing: border-box;
    }

    :root {
        --bg: #f4f5f7;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #d1d5db;
        --accent: #2563eb;
        --accent-light: #dbeafe;
        --green: #16a34a;
        --green-light: #dcfce7;
        --dark: #111827;
        --danger: #B0001B;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        padding: 0 0 165px;

        font-family:
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

        background: var(--bg);
        color: var(--text);
    }

    .app {
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        padding: 14px;
    }

    /* =========================================
       HEADER
       ========================================= */

    header {
        text-align: center;
        margin-bottom: 14px;
    }

    .game-toggle {
        display: flex;

        background: #e5e7eb;
        border-radius: 12px;
        padding: 4px;

        max-width: 440px;
        margin: 0 auto;
    }

    .game-toggle button {
        flex: 1;

        border: 0;
        padding: 11px 8px;

        border-radius: 9px;

        background: transparent;
        color: var(--muted);

        font-size: 14px;
        font-weight: 700;

        cursor: pointer;
    }

    .game-toggle button.active {
        background: white;
        color: var(--accent);

        box-shadow:
            0 1px 4px rgba(0, 0, 0, .12);
    }

    .header-actions {
        display: flex;
        justify-content: center;
        align-items: center;

        gap: 8px;
        margin-top: 10px;
    }

    .add-player-button,
    .reset-button {
        border: 0;
        border-radius: 9px;

        padding: 9px 14px;

        font-size: 13px;
        font-weight: 700;

        cursor: pointer;
    }

    .add-player-button {
        background: var(--dark);
        color: white;
    }

    .add-player-button:disabled {
        opacity: .4;
        cursor: default;
    }

    .reset-button {
        background: var(--danger);
        color: white;
    }

    .add-player-button:active,
    .reset-button:active {
        transform: scale(.97);
    }

    /* =========================================
       SCORECARD
       ========================================= */

    .scorecard {
        width: 100%;

        background: var(--card);

        border-radius: 14px;
        overflow: hidden;

        border: 1px solid var(--border);

        box-shadow:
            0 2px 8px rgba(0, 0, 0, .05);
    }

    /*
     * The first column is the category.
     * Player columns are inserted dynamically.
     */
    .score-row {
        display: grid;

        min-height: 47px;

        border-bottom: 1px solid var(--border);
    }

    .score-row:last-child {
        border-bottom: 0;
    }

    .score-row > div {
        display: flex;

        align-items: center;
        justify-content: center;

        padding: 7px;

        min-width: 0;
    }

    .score-row > div:first-child {
        justify-content: flex-start;
    }

    .header-row {
        background: var(--dark);
        color: white;

        font-weight: 800;
    }

    .header-row > div:first-child {
        color: white;
    }

    .section-row {
        background: #f3f4f6;

        font-size: 13px;
        font-weight: 800;

        color: #4b5563;

        text-transform: uppercase;
        letter-spacing: .04em;
    }

    .score-label {
        font-size: 14px;
        line-height: 1.2;
    }

    .player-name-input {
        width: 100%;

        border: 0;
        outline: none;

        background: transparent;

        color: white;

        text-align: center;

        font: inherit;
        font-weight: 800;

        min-width: 0;
    }

    .player-name-input::placeholder {
        color: #d1d5db;
    }

    .score-input {
        width: 60px;
        height: 36px;

        border: 1px solid var(--border);
        border-radius: 8px;

        text-align: center;

        font-size: 16px;
        font-weight: 700;

        outline: none;

        background: white;
    }

    .score-input:focus {
        border-color: var(--accent);

        box-shadow:
            0 0 0 2px var(--accent-light);
    }

    .calculated {
        font-weight: 700;
        color: var(--muted);
    }

    .bonus {
        color: var(--green);
    }

    .total-row {
        background: var(--dark);
        color: white;

        font-weight: 800;
        font-size: 18px;
    }

    .total-row .calculated {
        color: white;
    }

    .winner {
        background: var(--green-light);
        color: #166534 !important;
    }

    .hidden {
        display: none;
    }

    /* =========================================
       STICKY BOTTOM BAR
       ========================================= */

    .sticky-bar {
        position: fixed;

        left: 0;
        right: 0;
        bottom: 0;

        z-index: 1000;

        padding:
            8px
            max(8px, env(safe-area-inset-right))
            calc(8px + env(safe-area-inset-bottom))
            max(8px, env(safe-area-inset-left));

        background: rgba(17, 24, 39, .97);

        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);

        box-shadow:
            0 -4px 16px rgba(0, 0, 0, .18);
    }

    .sticky-inner {
        width: 100%;
        max-width: 1100px;

        margin: 0 auto;

        display: grid;

        gap: 1px;

        background: #4b5563;

        border-radius: 12px;
        overflow: hidden;
    }

    .player-status {
        min-width: 0;

        background: var(--dark);
        color: white;

        padding: 8px 10px;
    }

    .player-status-header {
        display: flex;

        align-items: center;
        justify-content: space-between;

        gap: 6px;

        margin-bottom: 5px;
    }

    .player-name-small {
        font-size: 12px;
        font-weight: 800;

        text-transform: uppercase;
        letter-spacing: .05em;

        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .score-title {
        color: #cbd5e1;

        font-size: 9px;

        text-transform: uppercase;
        letter-spacing: .08em;

        font-weight: 800;
    }

    .total-score {
        font-size: 26px;

        line-height: 1;

        font-weight: 900;
    }

    /* =========================================
       RE-ROLLS
       ========================================= */

    .reroll-area {
        display: flex;

        align-items: center;
        justify-content: space-between;

        gap: 6px;

        margin-top: 7px;
        padding-top: 7px;

        border-top: 1px solid #374151;
    }

    .reroll-label {
        color: #cbd5e1;

        font-size: 9px;

        text-transform: uppercase;
        letter-spacing: .08em;

        font-weight: 800;
    }

    .reroll-controls {
        display: flex;

        align-items: center;

        gap: 5px;
    }

    .reroll-number {
        min-width: 25px;

        text-align: center;

        font-size: 17px;
        font-weight: 900;
    }

    .reroll-button {
        width: 29px;
        height: 29px;

        padding: 0;

        border: 0;
        border-radius: 7px;

        background: white;
        color: var(--dark);

        font-size: 19px;
        font-weight: 900;

        cursor: pointer;

        line-height: 1;
    }

    .reroll-button:active {
        transform: scale(.94);
    }

    @media (max-width: 700px) {

        .app {
            padding: 10px;
        }

        .score-label {
            font-size: 13px;
        }

        .score-input {
            width: 52px;
            height: 34px;
        }

        .total-row {
            font-size: 16px;
        }

        .player-status {
            padding: 7px 8px;
        }

        .player-name-small {
            font-size: 11px;
        }

        .total-score {
            font-size: 22px;
        }
    }

    @media (max-width: 500px) {

        .score-row > div {
            padding: 5px 3px;
        }

        .score-label {
            font-size: 12px;
        }

        .score-input {
            width: 48px;
        }

        .player-name-input {
            font-size: 12px;
        }

        .total-score {
            font-size: 20px;
        }

        .reroll-button {
            width: 26px;
            height: 26px;
        }

        .reroll-label {
            display: none;
        }

        .player-status {
            padding: 6px;
        }
    }
</style>
</head>


<body>

<div class="app">

    <header>

        <div class="game-toggle">

            <button
                id="yatzyBtn"
                class="active"
                type="button"
                onclick="setGame('yatzy')"
            >
                Yatzy · 5 Dice
            </button>

            <button
                id="maxBtn"
                type="button"
                onclick="setGame('max')"
            >
                Max Yatzy · 6 Dice
            </button>

        </div>


        <div class="header-actions">

            <button
                id="addPlayerButton"
                class="add-player-button"
                type="button"
                onclick="addPlayer()"
            >
                ＋ Add Player
            </button>

            <button
                class="reset-button"
                type="button"
                onclick="resetGame()"
            >
                ↻ Reset Game
            </button>

        </div>

    </header>


    <!-- =========================================
         NORMAL YATZY
         ========================================= -->

    <div
        id="yatzyCard"
        class="scorecard"
    >

        <div
            id="yatzyHeader"
            class="score-row header-row"
        ></div>


        <div
            id="yatzyUpperSection"
            class="score-row section-row"
        ></div>


        <div id="yatzyUpperRows"></div>


        <div
            id="yatzyUpperTotalRow"
            class="score-row"
        ></div>


        <div
            id="yatzyBonusRow"
            class="score-row"
        ></div>


        <div
            id="yatzyLowerSection"
            class="score-row section-row"
        ></div>


        <div id="yatzyLowerRows"></div>


        <div
            id="yatzyTotalRow"
            class="score-row total-row"
        ></div>

    </div>


    <!-- =========================================
         MAX YATZY
         ========================================= -->

    <div
        id="maxCard"
        class="scorecard hidden"
    >

        <div
            id="maxHeader"
            class="score-row header-row"
        ></div>


        <div
            id="maxUpperSection"
            class="score-row section-row"
        ></div>


        <div id="maxUpperRows"></div>


        <div
            id="maxUpperTotalRow"
            class="score-row"
        ></div>


        <div
            id="maxBonusRow"
            class="score-row"
        ></div>


        <div
            id="maxLowerSection"
            class="score-row section-row"
        ></div>


        <div id="maxLowerRows"></div>


        <div
            id="maxTotalRow"
            class="score-row total-row"
        ></div>

    </div>

</div>


<!-- =========================================
     STICKY PLAYER BAR
     ========================================= -->

<div class="sticky-bar">

    <div
        id="stickyInner"
        class="sticky-inner"
    ></div>

</div>


<script>

/* =========================================
   CONFIGURATION
   ========================================= */

/*
 * This is the maximum number of players.
 */
const MAX_PLAYERS = 4;


/*
 * Default players.
 *
 * Change these names here if you want
 * different initial player names.
 */
const DEFAULT_PLAYERS = [
    "Marjo",
    "Aapeli"
];


/*
 * Max Yatzy re-rolls start at 0.
 */
const DEFAULT_REROLLS = 0;


/*
 * LocalStorage keys.
 */
const STORAGE_KEY =
    "yatzyScorecardV5";

const GAME_KEY =
    "yatzyCurrentGame";

const PLAYERS_KEY =
    "yatzyPlayersV1";

const REROLLS_KEY =
    "maxYatzyRerollsV3";


/*
 * Current game.
 */
let currentGame =
    localStorage.getItem(
        GAME_KEY
    ) || "yatzy";


/*
 * Load players.
 */
let players =
    loadPlayers();


/*
 * Load individual re-roll counters.
 */
let rerolls =
    loadRerolls();


/* =========================================
   CATEGORY DEFINITIONS
   ========================================= */

const upperCategories = [

    {
        key: "ones",
        label: "Ones"
    },

    {
        key: "twos",
        label: "Twos"
    },

    {
        key: "threes",
        label: "Threes"
    },

    {
        key: "fours",
        label: "Fours"
    },

    {
        key: "fives",
        label: "Fives"
    },

    {
        key: "sixes",
        label: "Sixes"
    }

];


const yatzyLowerCategories = [

    {
        key: "pair",
        label: "One Pair"
    },

    {
        key: "twoPairs",
        label: "Two Pairs"
    },

    {
        key: "threeKind",
        label: "Three of a Kind"
    },

    {
        key: "fourKind",
        label: "Four of a Kind"
    },

    {
        key: "fullHouse",
        label: "Full House"
    },

    {
        key: "smallStraight",
        label: "Small Straight"
    },

    {
        key: "largeStraight",
        label: "Large Straight"
    },

    {
        key: "chance",
        label: "Chance"
    },

    {
        key: "yatzy",
        label: "Yatzy (50)"
    }

];


const maxLowerCategories = [

    {
        key: "pair",
        label: "One Pair"
    },

    {
        key: "twoPairs",
        label: "Two Pairs"
    },

    {
        key: "threePairs",
        label: "Three Pairs"
    },

    {
        key: "threeKind",
        label: "Three of a Kind"
    },

    {
        key: "fourKind",
        label: "Four of a Kind"
    },

    {
        key: "fiveKind",
        label: "Five of a Kind"
    },

    {
        key: "smallStraight",
        label: "Small Straight"
    },

    {
        key: "largeStraight",
        label: "Large Straight"
    },

    {
        key: "fullStraight",
        label: "Full Straight"
    },

    {
        key: "fullHouse",
        label: "Full House"
    },

    {
        key: "talo",
        label: "Four of a Kind + Pair"
    },

    {
        key: "sauna",
        label: "Two Three of a Kinds"
    },

    {
        key: "chance",
        label: "Chance"
    },

    {
        key: "yatzy",
        label: "Yatzy (100)"
    }

];


/* =========================================
   PLAYER MANAGEMENT
   ========================================= */

function loadPlayers() {

    const saved =
        localStorage.getItem(
            PLAYERS_KEY
        );


    if (!saved) {

        return [
            ...DEFAULT_PLAYERS
        ];
    }


    try {

        const loaded =
            JSON.parse(saved);


        if (
            !Array.isArray(loaded) ||
            loaded.length < 1
        ) {

            return [
                ...DEFAULT_PLAYERS
            ];
        }


        return loaded
            .slice(0, MAX_PLAYERS)
            .map(
                (name, index) =>
                    String(name || `P${index + 1}`)
            );


    } catch {

        return [
            ...DEFAULT_PLAYERS
        ];
    }
}


function savePlayers() {

    localStorage.setItem(
        PLAYERS_KEY,
        JSON.stringify(players)
    );
}


/*
 * Adds a new player.
 *
 * New players automatically become:
 *
 * P3
 * P4
 */
function addPlayer() {

    if (
        players.length >= MAX_PLAYERS
    ) {
        return;
    }


    const nextNumber =
        players.length + 1;


    players.push(
        `P${nextNumber}`
    );


    /*
     * New player gets a fresh
     * re-roll counter.
     */
    rerolls[players.length] =
        DEFAULT_REROLLS;


    savePlayers();
    saveRerolls();


    rebuildScorecards();

    rebuildStickyBar();

    loadScoresForGame(
        currentGame
    );

    update();
}


/*
 * Change one player's name.
 */
function updatePlayerName(
    playerIndex,
    newName
) {

    const cleaned =
        newName.trim();


    if (!cleaned) {

        players[playerIndex] =
            `P${playerIndex + 1}`;

    } else {

        players[playerIndex] =
            cleaned;
    }


    savePlayers();

    updatePlayerNames();

    rebuildStickyBar();

    update();
}


/* =========================================
   RE-ROLL MANAGEMENT
   ========================================= */

function loadRerolls() {

    const saved =
        localStorage.getItem(
            REROLLS_KEY
        );


    const defaults = {};

    for (
        let i = 1;
        i <= MAX_PLAYERS;
        i++
    ) {
        defaults[i] =
            DEFAULT_REROLLS;
    }


    if (!saved) {
        return defaults;
    }


    try {

        const data =
            JSON.parse(saved);


        for (
            let i = 1;
            i <= MAX_PLAYERS;
            i++
        ) {

            const value =
                Number(data[i]);


            defaults[i] =
                Number.isFinite(value)
                    ? Math.max(0, value)
                    : DEFAULT_REROLLS;
        }


        return defaults;


    } catch {

        return defaults;
    }
}


function saveRerolls() {

    localStorage.setItem(
        REROLLS_KEY,
        JSON.stringify(rerolls)
    );
}


function changeRerolls(
    playerNumber,
    amount
) {

    rerolls[playerNumber] =
        Math.max(
            0,
            rerolls[playerNumber] + amount
        );


    saveRerolls();

    updateRerollDisplay();
}


function updateRerollDisplay() {

    for (
        let i = 1;
        i <= players.length;
        i++
    ) {

        const element =
            document.getElementById(
                `rerolls${i}`
            );


        if (element) {

            element.textContent =
                rerolls[i];
        }
    }
}


/* =========================================
   SCORE STORAGE
   ========================================= */

function getStoredData() {

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );


    if (!saved) {

        return {
            yatzy: {},
            max: {}
        };
    }


    try {

        const data =
            JSON.parse(saved);


        return {

            yatzy:
                data.yatzy || {},

            max:
                data.max || {}
        };


    } catch {

        return {
            yatzy: {},
            max: {}
        };
    }
}


function saveGame() {

    const data =
        getStoredData();


    document
        .querySelectorAll(".score")
        .forEach(input => {

            const game =
                input.dataset.game;


            const key =
                input.dataset.cat +
                "_" +
                input.dataset.player;


            if (!data[game]) {
                data[game] = {};
            }


            data[game][key] =
                input.value;
        });


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );


    localStorage.setItem(
        GAME_KEY,
        currentGame
    );
}


function loadScoresForGame(game) {

    const data =
        getStoredData();


    const scores =
        data[game] || {};


    document
        .querySelectorAll(
            `.score[data-game="${game}"]`
        )
        .forEach(input => {

            const key =
                input.dataset.cat +
                "_" +
                input.dataset.player;


            input.value =
                scores[key] !== undefined
                    ? scores[key]
                    : "";
        });
}


/* =========================================
   SCORECARD BUILDING
   ========================================= */

function createInput(
    game,
    category,
    player
) {

    const input =
        document.createElement("input");


    input.className =
        "score-input score";


    input.type =
        "number";


    input.inputMode =
        "numeric";


    input.min =
        "0";


    input.step =
        "1";


    input.dataset.game =
        game;


    input.dataset.cat =
        category;


    input.dataset.player =
        player;


    return input;
}


/*
 * Set the grid columns based on
 * the number of players.
 */
function getGridTemplate() {

    /*
     * Category column is at least 150px.
     * Player columns share the rest.
     */
    return `minmax(150px, 1fr) repeat(${players.length}, minmax(62px, 1fr))`;
}


/*
 * Create a standard row:
 *
 * Category | P1 | P2 | P3 | P4
 */
function createStandardRow(
    label,
    className = ""
) {

    const row =
        document.createElement("div");


    row.className =
        `score-row ${className}`.trim();


    row.style.gridTemplateColumns =
        getGridTemplate();


    const labelCell =
        document.createElement("div");


    labelCell.textContent =
        label;


    row.appendChild(
        labelCell
    );


    for (
        let player = 1;
        player <= players.length;
        player++
    ) {

        const cell =
            document.createElement("div");


        row.appendChild(
            cell
        );
    }


    return row;
}


/*
 * Create a score row with inputs.
 */
function createScoreRow(
    game,
    category
) {

    const row =
        document.createElement("div");


    row.className =
        "score-row";


    row.style.gridTemplateColumns =
        getGridTemplate();


    const label =
        document.createElement("div");


    label.className =
        "score-label";


    label.textContent =
        category.label;


    row.appendChild(
        label
    );


    for (
        let player = 1;
        player <= players.length;
        player++
    ) {

        const cell =
            document.createElement("div");


        cell.appendChild(
            createInput(
                game,
                category.key,
                player
            )
        );


        row.appendChild(
            cell
        );
    }


    return row;
}


/*
 * Creates the header:
 *
 * Category | Marjo | Aapeli | P3 | P4
 */
function createHeader(
    containerId
) {

    const container =
        document.getElementById(
            containerId
        );


    container.innerHTML =
        "";


    container.style.gridTemplateColumns =
        getGridTemplate();


    const categoryCell =
        document.createElement("div");


    categoryCell.textContent =
        "Category";


    container.appendChild(
        categoryCell
    );


    players.forEach(
        (name, index) => {

            const cell =
                document.createElement("div");


            const input =
                document.createElement(
                    "input"
                );


            input.className =
                "player-name-input";


            input.type =
                "text";


            input.value =
                name;


            input.placeholder =
                `P${index + 1}`;


            input.maxLength =
                20;


            input.title =
                "Tap to rename player";


            input.addEventListener(
                "change",
                () => {

                    updatePlayerName(
                        index,
                        input.value
                    );
                }
            );


            input.addEventListener(
                "blur",
                () => {

                    updatePlayerName(
                        index,
                        input.value
                    );
                }
            );


            cell.appendChild(
                input
            );


            container.appendChild(
                cell
            );
        }
    );
}


/*
 * Rebuild the whole scorecard after
 * adding a player.
 */
function rebuildScorecards() {

    /*
     * Clear existing rows.
     */
    const ids = [

        "yatzyUpperRows",
        "yatzyLowerRows",

        "maxUpperRows",
        "maxLowerRows"

    ];


    ids.forEach(id => {

        document.getElementById(
            id
        ).innerHTML = "";
    });


    /*
     * Headers.
     */
    createHeader(
        "yatzyHeader"
    );

    createHeader(
        "maxHeader"
    );


    /*
     * Section rows.
     */
    setupSectionRow(
        "yatzyUpperSection",
        "Upper Section"
    );

    setupSectionRow(
        "yatzyLowerSection",
        "Lower Section"
    );

    setupSectionRow(
        "maxUpperSection",
        "Upper Section"
    );

    setupSectionRow(
        "maxLowerSection",
        "Lower Section"
    );


    /*
     * Upper categories.
     */
    upperCategories.forEach(
        category => {

            document
                .getElementById(
                    "yatzyUpperRows"
                )
                .appendChild(
                    createScoreRow(
                        "yatzy",
                        category
                    )
                );


            document
                .getElementById(
                    "maxUpperRows"
                )
                .appendChild(
                    createScoreRow(
                        "max",
                        category
                    )
                );
        }
    );


    /*
     * Lower Yatzy categories.
     */
    yatzyLowerCategories.forEach(
        category => {

            document
                .getElementById(
                    "yatzyLowerRows"
                )
                .appendChild(
                    createScoreRow(
                        "yatzy",
                        category
                    )
                );
        }
    );


    /*
     * Lower Max Yatzy categories.
     */
    maxLowerCategories.forEach(
        category => {

            document
                .getElementById(
                    "maxLowerRows"
                )
                .appendChild(
                    createScoreRow(
                        "max",
                        category
                    )
                );
        }
    );


    /*
     * Calculated rows.
     */
    buildCalculatedRows();
}


/*
 * Section row helper.
 */
function setupSectionRow(
    id,
    label
) {

    const row =
        document.getElementById(id);


    row.innerHTML =
        "";


    row.style.gridTemplateColumns =
        getGridTemplate();


    const first =
        document.createElement("div");


    first.textContent =
        label;


    row.appendChild(
        first
    );


    for (
        let i = 0;
        i < players.length;
        i++
    ) {

        const empty =
            document.createElement("div");


        row.appendChild(
            empty
        );
    }
}


/*
 * Build calculated rows.
 */
function buildCalculatedRows() {

    buildCalculatedRow(
        "yatzyUpperTotalRow",
        "Upper Total",
        "yatzyUpper"
    );


    buildCalculatedRow(
        "yatzyBonusRow",
        "Bonus",
        "yatzyBonus"
    );


    buildCalculatedRow(
        "yatzyTotalRow",
        "🏆 TOTAL",
        "yatzyTotal",
        true
    );


    buildCalculatedRow(
        "maxUpperTotalRow",
        "Upper Total",
        "maxUpper"
    );


    buildCalculatedRow(
        "maxBonusRow",
        "Bonus",
        "maxBonus"
    );


    buildCalculatedRow(
        "maxTotalRow",
        "🏆 TOTAL",
        "maxTotal",
        true
    );
}


/*
 * Create a calculated row.
 */
function buildCalculatedRow(
    id,
    label,
    prefix,
    totalRow = false
) {

    const row =
        document.getElementById(id);


    row.innerHTML =
        "";


    row.style.gridTemplateColumns =
        getGridTemplate();


    const labelCell =
        document.createElement("div");


    if (totalRow) {

        labelCell.innerHTML =
            `<strong>${label}</strong>`;

    } else {

        labelCell.textContent =
            label;
    }


    row.appendChild(
        labelCell
    );


    for (
        let player = 1;
        player <= players.length;
        player++
    ) {

        const cell =
            document.createElement("div");


        cell.id =
            `${prefix}${player}`;


        cell.className =
            "calculated";


        if (
            label === "Bonus"
        ) {
            cell.classList.add(
                "bonus"
            );
        }


        row.appendChild(
            cell
        );
    }
}


/* =========================================
   PLAYER HEADER / GRID UPDATE
   ========================================= */

function updatePlayerNames() {

    document
        .querySelectorAll(
            ".player-name-input"
        )
        .forEach(
            (input, index) => {

                if (
                    players[index] !== undefined
                ) {

                    input.value =
                        players[index];
                }
            }
        );
}


/*
 * Update every score row grid width.
 */
function updateGridColumns() {

    const template =
        getGridTemplate();


    document
        .querySelectorAll(
            ".score-row"
        )
        .forEach(row => {

            row.style.gridTemplateColumns =
                template;
        });
}


/* =========================================
   STICKY PLAYER BAR
   ========================================= */

function rebuildStickyBar() {

    const container =
        document.getElementById(
            "stickyInner"
        );


    container.innerHTML =
        "";


    /*
     * One column per player.
     */
    container.style.gridTemplateColumns =
        `repeat(${players.length}, minmax(0, 1fr))`;


    for (
        let player = 1;
        player <= players.length;
        player++
    ) {

        const status =
            document.createElement("div");


        status.className =
            "player-status";


        status.innerHTML = `

            <div class="player-status-header">

                <span
                    id="stickyName${player}"
                    class="player-name-small"
                >
                    ${escapeHtml(
                        players[player - 1]
                    )}
                </span>

                <span class="score-title">
                    Total
                </span>

            </div>


            <div
                id="stickyTotal${player}"
                class="total-score"
            >
                0
            </div>


            <div
                id="rerollArea${player}"
                class="reroll-area hidden"
            >

                <span class="reroll-label">
                    Re-rolls
                </span>


                <div class="reroll-controls">

                    <button
                        class="reroll-button"
                        type="button"
                        onclick="changeRerolls(${player}, -1)"
                        aria-label="Use one re-roll"
                    >
                        −
                    </button>


                    <span
                        id="rerolls${player}"
                        class="reroll-number"
                    >
                        ${rerolls[player]}
                    </span>


                    <button
                        class="reroll-button"
                        type="button"
                        onclick="changeRerolls(${player}, 1)"
                        aria-label="Add one re-roll"
                    >
                        +
                    </button>

                </div>

            </div>
        `;


        container.appendChild(
            status
        );
    }


    updateRerollVisibility();

    updateRerollDisplay();
}


/*
 * Max Yatzy shows re-roll controls.
 * Normal Yatzy hides them.
 */
function updateRerollVisibility() {

    for (
        let player = 1;
        player <= players.length;
        player++
    ) {

        const area =
            document.getElementById(
                `rerollArea${player}`
            );


        if (!area) {
            continue;
        }


        area.classList.toggle(
            "hidden",
            currentGame !== "max"
        );
    }
}


/* =========================================
   SCORE CALCULATIONS
   ========================================= */

function getScore(
    game,
    category,
    player
) {

    const input =
        document.querySelector(
            `.score[data-game="${game}"][data-cat="${category}"][data-player="${player}"]`
        );


    if (
        !input ||
        input.value === ""
    ) {
        return 0;
    }


    const value =
        Number(input.value);


    if (
        !Number.isFinite(value) ||
        value < 0
    ) {
        return 0;
    }


    return value;
}


/*
 * Upper section total.
 */
function getUpperTotal(
    game,
    player
) {

    return upperCategories.reduce(
        (
            sum,
            category
        ) => {

            return sum +
                getScore(
                    game,
                    category.key,
                    player
                );

        },
        0
    );
}


/*
 * Normal Yatzy.
 */
function updateYatzy() {

    const totals =
        Array(
            players.length
        ).fill(0);


    for (
        let player = 1;
        player <= players.length;
        player++
    ) {

        const upper =
            getUpperTotal(
                "yatzy",
                player
            );


        const bonus =
            upper >= 63
                ? 50
                : 0;


        document.getElementById(
            `yatzyUpper${player}`
        ).textContent =
            upper;


        document.getElementById(
            `yatzyBonus${player}`
        ).textContent =
            bonus;


        let total =
            upper + bonus;


        yatzyLowerCategories
            .forEach(category => {

                total +=
                    getScore(
                        "yatzy",
                        category.key,
                        player
                    );
            });


        totals[player - 1] =
            total;


        document.getElementById(
            `yatzyTotal${player}`
        ).textContent =
            total;
    }


    updateWinners(
        "yatzyTotal",
        totals
    );


    updateStickyTotals(
        totals
    );
}


/*
 * Max Yatzy.
 *
 * Upper bonus threshold:
 * 75 points.
 *
 * Bonus:
 * 50 points.
 */
function updateMax() {

    const totals =
        Array(
            players.length
        ).fill(0);


    for (
        let player = 1;
        player <= players.length;
        player++
    ) {

        const upper =
            getUpperTotal(
                "max",
                player
            );


        const bonus =
            upper >= 75
                ? 50
                : 0;


        document.getElementById(
            `maxUpper${player}`
        ).textContent =
            upper;


        document.getElementById(
            `maxBonus${player}`
        ).textContent =
            bonus;


        let total =
            upper + bonus;


        maxLowerCategories
            .forEach(category => {

                total +=
                    getScore(
                        "max",
                        category.key,
                        player
                    );
            });


        totals[player - 1] =
            total;


        document.getElementById(
            `maxTotal${player}`
        ).textContent =
            total;
    }


    updateWinners(
        "maxTotal",
        totals
    );


    updateStickyTotals(
        totals
    );
}


/* =========================================
   WINNER HANDLING
   ========================================= */

function updateWinners(
    prefix,
    totals
) {

    /*
     * Remove winner highlighting.
     */
    for (
        let player = 1;
        player <= players.length;
        player++
    ) {

        const element =
            document.getElementById(
                `${prefix}${player}`
            );


        if (element) {

            element.classList.remove(
                "winner"
            );
        }
    }


    /*
     * Find the highest score.
     */
    const highest =
        Math.max(
            ...totals
        );


    /*
     * Highlight only if there
     * is an actual score lead.
     */
    const hasLead =
        totals.filter(
            score =>
                score === highest
        ).length === 1;


    if (!hasLead) {
        return;
    }


    const winnerIndex =
        totals.indexOf(
            highest
        );


    const winnerElement =
        document.getElementById(
            `${prefix}${winnerIndex + 1}`
        );


    if (winnerElement) {

        winnerElement.classList.add(
            "winner"
        );
    }
}


/*
 * Sticky totals.
 */
function updateStickyTotals(
    totals
) {

    for (
        let player = 1;
        player <= players.length;
        player++
    ) {

        const element =
            document.getElementById(
                `stickyTotal${player}`
            );


        if (element) {

            element.textContent =
                totals[player - 1];
        }
    }
}


/* =========================================
   GAME SWITCH
   ========================================= */

function setGame(game) {

    currentGame =
        game;


    const isMax =
        game === "max";


    document
        .getElementById(
            "yatzyBtn"
        )
        .classList.toggle(
            "active",
            !isMax
        );


    document
        .getElementById(
            "maxBtn"
        )
        .classList.toggle(
            "active",
            isMax
        );


    document
        .getElementById(
            "yatzyCard"
        )
        .classList.toggle(
            "hidden",
            isMax
        );


    document
        .getElementById(
            "maxCard"
        )
        .classList.toggle(
            "hidden",
            !isMax
        );


    loadScoresForGame(
        game
    );


    updateRerollVisibility();

    update();

    saveGame();
}


/* =========================================
   RESET GAME
   ========================================= */

function resetGame() {

    const confirmed =
        confirm(
            "Reset the current game?\n\n" +
            "All scores for the current game will be cleared.\n" +
            "All player re-roll counters will be set to 0."
        );


    if (!confirmed) {
        return;
    }


    /*
     * Clear only the currently
     * selected game's score inputs.
     */
    document
        .querySelectorAll(
            `.score[data-game="${currentGame}"]`
        )
        .forEach(input => {

            input.value =
                "";
        });


    /*
     * Reset all existing players'
     * re-roll counters.
     */
    for (
        let player = 1;
        player <= players.length;
        player++
    ) {

        rerolls[player] =
            DEFAULT_REROLLS;
    }


    saveRerolls();

    updateRerollDisplay();

    saveGame();

    update();
}


/* =========================================
   GENERAL UPDATE
   ========================================= */

function update() {

    if (
        currentGame === "max"
    ) {

        updateMax();

    } else {

        updateYatzy();
    }


    updateRerollDisplay();

    updateRerollVisibility();

    saveGame();
}


/* =========================================
   INPUT EVENTS
   ========================================= */

document.addEventListener(
    "input",
    event => {

        /*
         * Score changes.
         */
        if (
            event.target.classList.contains(
                "score"
            )
        ) {

            update();
        }


        /*
         * Player-name changes are
         * handled separately.
         */
    }
);


/* =========================================
   ESCAPE HTML
   ========================================= */

function escapeHtml(value) {

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}


/* =========================================
   START APPLICATION
   ========================================= */

/*
 * Build everything for the first time.
 */
rebuildScorecards();

rebuildStickyBar();


/*
 * Load scores for the currently
 * selected game.
 */
loadScoresForGame(
    currentGame
);


/*
 * Set correct game visibility.
 */
setGame(
    currentGame
);


/*
 * Final UI update.
 */
update();

</script>
