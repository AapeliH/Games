<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>
<title>Yatzy Scorecard</title>

<style>
    * {
        box-sizing: border-box;
    }

    :root {
        --bg: #f4f5f7;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #d1d5db;
        --accent: #2563eb;
        --accent-light: #dbeafe;
        --green: #16a34a;
        --green-light: #dcfce7;
        --dark: #111827;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        padding: 0 0 145px;
        font-family:
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;
        background: var(--bg);
        color: var(--text);
    }

    .app {
        width: 100%;
        max-width: 720px;
        margin: 0 auto;
        padding: 14px;
    }

    header {
        text-align: center;
        margin-bottom: 14px;
    }

    h1 {
        margin: 0 0 12px;
        font-size: clamp(28px, 8vw, 42px);
    }

    /* =========================================
       GAME TOGGLE
       ========================================= */

.reset-button {
    margin-top: 10px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    padding: 8px 14px;
    background: #B0001B;
    color: white;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
}

.reset-button:active {
    transform: scale(.97);
}

.reset-button:hover {
    background: #f9fafb;
    color: #B0001B;
}

    .game-toggle {
        display: flex;
        background: #e5e7eb;
        border-radius: 12px;
        padding: 4px;
        max-width: 440px;
        margin: 0 auto;
    }

    .game-toggle button {
        flex: 1;
        border: 0;
        padding: 11px 8px;
        border-radius: 9px;
        background: transparent;
        color: var(--muted);
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
    }

    .game-toggle button.active {
        background: white;
        color: var(--accent);
        box-shadow: 0 1px 4px rgba(0, 0, 0, .12);
    }

    /* =========================================
       SCORECARD
       ========================================= */

    .scorecard {
        background: var(--card);
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid var(--border);
        box-shadow: 0 2px 8px rgba(0, 0, 0, .05);
    }

    .score-row {
        display: grid;
        grid-template-columns: minmax(155px, 1fr) 82px 82px;
        min-height: 47px;
        border-bottom: 1px solid var(--border);
    }

    .score-row:last-child {
        border-bottom: 0;
    }

    .score-row > div {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 7px;
    }

    .score-row > div:first-child {
        justify-content: flex-start;
    }

    .header-row {
        background: var(--dark);
        color: white;
        font-weight: 800;
    }

    .section-row {
        background: #f3f4f6;
        font-size: 13px;
        font-weight: 800;
        color: #4b5563;
        text-transform: uppercase;
        letter-spacing: .04em;
    }

    .score-label {
        font-size: 14px;
        line-height: 1.2;
    }

    .score-input {
        width: 60px;
        height: 36px;
        border: 1px solid var(--border);
        border-radius: 8px;
        text-align: center;
        font-size: 16px;
        font-weight: 700;
        outline: none;
        background: white;
    }

    .score-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-light);
    }

    .calculated {
        font-weight: 700;
        color: var(--muted);
    }

    .bonus {
        color: var(--green);
    }

    .total-row {
        background: var(--dark);
        color: white;
        font-weight: 800;
        font-size: 18px;
    }

    .total-row .calculated {
        color: white;
    }

    .winner {
        background: var(--green-light);
        color: #166534 !important;
    }

    .hidden {
        display: none;
    }

    /* =========================================
       STICKY BOTTOM BAR
       ========================================= */

    .sticky-bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 1000;

        padding:
            8px
            max(8px, env(safe-area-inset-right))
            calc(8px + env(safe-area-inset-bottom))
            max(8px, env(safe-area-inset-left));

        background: rgba(17, 24, 39, .97);

        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);

        box-shadow:
            0 -4px 16px rgba(0, 0, 0, .18);
    }

    .sticky-inner {
        width: 100%;
        max-width: 720px;
        margin: 0 auto;

        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px;

        background: #4b5563;
        border-radius: 12px;
        overflow: hidden;
    }

    .player-status {
        background: var(--dark);
        color: white;
        padding: 8px 10px;
        min-width: 0;
    }

    .player-status-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        margin-bottom: 5px;
    }

    .player-name-small {
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: .05em;
    }

    .total-score {
        font-size: 26px;
        line-height: 1;
        font-weight: 900;
    }

    .score-title {
        color: #cbd5e1;
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: .08em;
        font-weight: 800;
    }

    /* Re-roll area */

    .reroll-area {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        margin-top: 7px;
        padding-top: 7px;
        border-top: 1px solid #374151;
    }

    .reroll-label {
        color: #cbd5e1;
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: .08em;
        font-weight: 800;
    }

    .reroll-controls {
        display: flex;
        align-items: center;
        gap: 5px;
    }

    .reroll-number {
        min-width: 25px;
        text-align: center;
        font-size: 17px;
        font-weight: 900;
    }

    .l-button {
        width: 29px;
        height: 29px;
        padding: 0;
        border: 0;
        border-radius: 7px;
        background: white;
        color: var(--dark);
        font-size: 19px;
        font-weight: 900;
        cursor: pointer;
        line-height: 1;
    }

    .l-button:active {
        transform: scale(.94);
    }

    .hidden-l {
        display: none;
    }

    @media (max-width: 480px) {
        .app {
            padding: 10px;
        }

        .score-row {
            grid-template-columns: minmax(132px, 1fr) 64px 64px;
        }

        .score-row > div {
            padding: 5px;
        }

        .score-label {
            font-size: 13px;
        }

        .score-input {
            width: 52px;
            height: 34px;
        }

        .header-row {
            font-size: 13px;
        }

        .total-row {
            font-size: 16px;
        }

        .player-status {
            padding: 7px 8px;
        }

        .player-name-small {
            font-size: 11px;
        }

        .total-score {
            font-size: 22px;
        }
    }

    @media (max-width: 350px) {
        .score-row {
            grid-template-columns: minmax(110px, 1fr) 58px 58px;
        }

        .score-input {
            width: 48px;
        }

        .score-label {
            font-size: 12px;
        }

        .total-score {
            font-size: 20px;
        }

        .l-button {
            width: 26px;
            height: 26px;
        }
    }
</style>
</head>

<body>

<div class="app">

    <header>

        <div class="game-toggle">
            <button
                id="yatzyBtn"
                class="active"
                type="button"
                onclick="setGame('yatzy')"
            >
                Yatzy · 5 Dice
            </button>

            <button
                id="maxBtn"
                type="button"
                onclick="setGame('max')"
            >
                Max Yatzy · 6 Dice
        </div>
	<div>
            </button>
		<button
		    id="resetGameButton"
		    class="reset-button"
		    type="button"
		    onclick="resetGame()"
		>
		    ↻ Reset Game
		</button>
	</div>
    </header>


    <!-- =========================================
         NORMAL YATZY
         ========================================= -->

    <div id="yatzyCard" class="scorecard">

        <div class="score-row section-row">
            <div>Upper Section</div>
            <div>Marjo</div>
            <div>Aapeli</div>
        </div>

        <div id="yatzyUpperRows"></div>

        <div class="score-row">
            <div><strong>Upper Total</strong></div>
            <div id="yatzyUpper1" class="calculated">0</div>
            <div id="yatzyUpper2" class="calculated">0</div>
        </div>

        <div class="score-row">
            <div>Bonus</div>
            <div id="yatzyBonus1" class="calculated bonus">0</div>
            <div id="yatzyBonus2" class="calculated bonus">0</div>
        </div>

        <div class="score-row section-row">
            <div>Lower Section</div>
            <div></div>
            <div></div>
        </div>

        <div id="yatzyLowerRows"></div>

        <div class="score-row total-row">
            <div>🏆 TOTAL</div>
            <div id="yatzyTotal1" class="calculated">0</div>
            <div id="yatzyTotal2" class="calculated">0</div>
        </div>

    </div>


    <!-- =========================================
         MAX YATZY
         ========================================= -->

    <div id="maxCard" class="scorecard hidden">

        <div class="score-row section-row">
            <div>Upper Section</div>
            <div>Marjo</div>
            <div>Aapeli</div>
        </div>

        <div id="maxUpperRows"></div>

        <div class="score-row">
            <div><strong>Upper Total</strong></div>
            <div id="maxUpper1" class="calculated">0</div>
            <div id="maxUpper2" class="calculated">0</div>
        </div>

        <div class="score-row">
            <div>Bonus</div>
            <div id="maxBonus1" class="calculated bonus">0</div>
            <div id="maxBonus2" class="calculated bonus">0</div>
        </div>

        <div class="score-row section-row">
            <div>Lower Section</div>
            <div></div>
            <div></div>
        </div>

        <div id="maxLowerRows"></div>

        <div class="score-row total-row">
            <div>🏆 TOTAL</div>
            <div id="maxTotal1" class="calculated">0</div>
            <div id="maxTotal2" class="calculated">0</div>
        </div>

    </div>

</div>


<!-- =========================================
     STICKY BOTTOM BAR
     ========================================= -->

<div class="sticky-bar">

    <div class="sticky-inner">

        <!-- MARJO -->

        <div class="player-status">

            <div class="player-status-header">
                <span class="player-name-small">Marjo</span>
                <span class="score-title">Total</span>
            </div>

            <div
                id="stickyTotal1"
                class="total-score"
            >
                0
            </div>

            <div
                id="lArea1"
                class="l-area hidden-l"
            >

                <span class="l-label">
                    Re-rolls
                </span>

                <div class="l-controls">

                    <button
                        class="l-button"
                        type="button"
                        onclick="changels(1, -1)"
                        aria-label="Use one Marjo re-roll"
                    >
                        −
                    </button>

                    <span
                        id="ls1"
                        class="l-number"
                    >
                        3
                    </span>

                    <button
                        class="l-button"
                        type="button"
                        onclick="changels(1, 1)"
                        aria-label="Add one Marjo re-roll"
                    >
                        +
                    </button>

                </div>

            </div>

        </div>


        <!-- AAPELI -->

        <div class="player-status">

            <div class="player-status-header">
                <span class="player-name-small">Aapeli</span>
                <span class="score-title">Total</span>
            </div>

            <div
                id="stickyTotal2"
                class="total-score"
            >
                0
            </div>

            <div
                id="rerollArea2"
                class="reroll-area hidden-reroll"
            >

                <span class="reroll-label">
                    Re-rolls
                </span>

                <div class="reroll-controls">

                    <button
                        class="reroll-button"
                        type="button"
                        onclick="changeRerolls(2, -1)"
                        aria-label="Use one Aapeli re-roll"
                    >
                        −
                    </button>

                    <span
                        id="rerolls2"
                        class="reroll-number"
                    >
                        3
                    </span>

                    <button
                        class="reroll-button"
                        type="button"
                        onclick="changeRerolls(2, 1)"
                        aria-label="Add one Aapeli re-roll"
                    >
                        +
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

/* =========================================
   STORAGE
   ========================================= */

const STORAGE_KEY = "yatzyScorecardV4";
const GAME_KEY = "yatzyCurrentGame";

let currentGame =
    localStorage.getItem(GAME_KEY) || "yatzy";


/*============
reset game
=============*/

function resetGame() {

    const confirmed = confirm(
        "Reset the current game?\n\n" +
        "All scores for the current game will be cleared."
    );

    if (!confirmed) {
        return;
    }

    /*
     * Clear scores only for the currently selected game.
     *
     * This means:
     * - Resetting Yatzy does NOT erase Max Yatzy.
     * - Resetting Max Yatzy does NOT erase Yatzy.
     */
    document
        .querySelectorAll(
            `.score[data-game="${currentGame}"]`
        )
        .forEach(input => {
            input.value = "";
        });


    /*
     * Reset both players' Max Yatzy re-rolls
     * back to 3.
     */
    rerolls[1] = 0;
    rerolls[2] = 0;

    saveRerolls();
    updateRerollDisplay();


    /*
     * Save the cleared scores.
     */
    saveGame();

    /*
     * Recalculate all totals.
     */
    update();
}

/* =========================================
   RE-ROLL COUNTERS
   ========================================= */

let rerolls = loadRerolls();

function loadRerolls() {

    const saved =
        localStorage.getItem("maxYatzyRerollsV2");

    if (!saved) {
        return {
            1: 0,
            2: 0
        };
    }

    try {

        const data = JSON.parse(saved);

        return {
            1: Number.isFinite(Number(data[1]))
                ? Math.max(0, Number(data[1]))
                : 0,

            2: Number.isFinite(Number(data[2]))
                ? Math.max(0, Number(data[2]))
                : 0
        };

    } catch {

        return {
            1: 0,
            2: 0
        };
    }
}


function saveRerolls() {

    localStorage.setItem(
        "maxYatzyRerollsV2",
        JSON.stringify(rerolls)
    );
}


function changeRerolls(player, amount) {

    rerolls[player] =
        Math.max(
            0,
            rerolls[player] + amount
        );

    saveRerolls();
    updateRerollDisplay();
}


function updateRerollDisplay() {

    document.getElementById("rerolls1")
        .textContent = rerolls[1];

    document.getElementById("rerolls2")
        .textContent = rerolls[2];
}


/* =========================================
   CATEGORY DEFINITIONS
   ========================================= */

const upperCategories = [
    {
        key: "ones",
        label: "Ones"
    },
    {
        key: "twos",
        label: "Twos"
    },
    {
        key: "threes",
        label: "Threes"
    },
    {
        key: "fours",
        label: "Fours"
    },
    {
        key: "fives",
        label: "Fives"
    },
    {
        key: "sixes",
        label: "Sixes"
    }
];


const yatzyLowerCategories = [
    {
        key: "pair",
        label: "One Pair"
    },
    {
        key: "twoPairs",
        label: "Two Pairs"
    },
    {
        key: "threeKind",
        label: "Three of a Kind"
    },
    {
        key: "fourKind",
        label: "Four of a Kind"
    },
    {
        key: "fullHouse",
        label: "Full House"
    },
    {
        key: "smallStraight",
        label: "Small Straight"
    },
    {
        key: "largeStraight",
        label: "Large Straight"
    },
    {
        key: "chance",
        label: "Chance"
    },
    {
        key: "yatzy",
        label: "Yatzy"
    }
];


/*
 * Max Yatzy categories.
 *
 * The scoring remains based on the rules provided:
 *
 * 1 Pair
 * 2 Pairs
 * 3 Pairs
 * Three of a Kind
 * Four of a Kind
 * Five of a Kind
 * Small Straight
 * Large Straight
 * Full Straight
 * Full House
 * Four of a Kind + Pair
 * Two Three of a Kinds
 * Chance
 * Yatzy
 */

const maxLowerCategories = [
    {
        key: "pair",
        label: "One Pair"
    },
    {
        key: "twoPairs",
        label: "Two Pairs"
    },
    {
        key: "threePairs",
        label: "Three Pairs"
    },
    {
        key: "threeKind",
        label: "Three of a Kind"
    },
    {
        key: "fourKind",
        label: "Four of a Kind"
    },
    {
        key: "fiveKind",
        label: "Five of a Kind"
    },
    {
        key: "smallStraight",
        label: "Small Straight"
    },
    {
        key: "largeStraight",
        label: "Large Straight"
    },
    {
        key: "fullStraight",
        label: "Full Straight"
    },
    {
        key: "fullHouse",
        label: "Full House"
    },
    {
        key: "talo",
        label: "Four of a Kind + Pair"
    },
    {
        key: "sauna",
        label: "Two Three of a Kinds"
    },
    {
        key: "chance",
        label: "Chance"
    },
    {
        key: "yatzy",
        label: "Yatzy"
    }
];


/* =========================================
   BUILD SCORECARD
   ========================================= */

function createInput(
    game,
    category,
    player
) {

    const input =
        document.createElement("input");

    input.className =
        "score-input score";

    input.type = "number";
    input.inputMode = "numeric";
    input.min = "0";
    input.step = "1";

    input.dataset.game =
        game;

    input.dataset.cat =
        category;

    input.dataset.player =
        player;

    return input;
}


function createScoreRows(
    game,
    categories
) {

    const fragment =
        document.createDocumentFragment();

    categories.forEach(category => {

        const row =
            document.createElement("div");

        row.className =
            "score-row";


        const label =
            document.createElement("div");

        label.className =
            "score-label";

        label.textContent =
            category.label;


        row.appendChild(label);


        for (
            let player = 1;
            player <= 2;
            player++
        ) {

            const cell =
                document.createElement("div");

            cell.appendChild(
                createInput(
                    game,
                    category.key,
                    player
                )
            );

            row.appendChild(cell);
        }


        fragment.appendChild(row);
    });


    return fragment;
}


function buildScorecards() {

    document
        .getElementById("yatzyUpperRows")
        .appendChild(
            createScoreRows(
                "yatzy",
                upperCategories
            )
        );


    document
        .getElementById("yatzyLowerRows")
        .appendChild(
            createScoreRows(
                "yatzy",
                yatzyLowerCategories
            )
        );


    document
        .getElementById("maxUpperRows")
        .appendChild(
            createScoreRows(
                "max",
                upperCategories
            )
        );


    document
        .getElementById("maxLowerRows")
        .appendChild(
            createScoreRows(
                "max",
                maxLowerCategories
            )
        );
}


/* =========================================
   SCORE STORAGE
   ========================================= */

function getStoredData() {

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );


    if (!saved) {

        return {
            yatzy: {},
            max: {}
        };
    }


    try {

        const data =
            JSON.parse(saved);

        return {
            yatzy:
                data.yatzy || {},

            max:
                data.max || {}
        };

    } catch {

        return {
            yatzy: {},
            max: {}
        };
    }
}


function saveGame() {

    const data =
        getStoredData();


    document
        .querySelectorAll(".score")
        .forEach(input => {

            const game =
                input.dataset.game;

            const key =
                input.dataset.cat +
                "_" +
                input.dataset.player;


            if (!data[game]) {
                data[game] = {};
            }


            data[game][key] =
                input.value;
        });


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );


    localStorage.setItem(
        GAME_KEY,
        currentGame
    );
}


function loadScoresForGame(game) {

    const data =
        getStoredData();

    const scores =
        data[game] || {};


    document
        .querySelectorAll(
            `.score[data-game="${game}"]`
        )
        .forEach(input => {

            const key =
                input.dataset.cat +
                "_" +
                input.dataset.player;


            input.value =
                scores[key] !== undefined
                    ? scores[key]
                    : "";
        });
}


/* =========================================
   SCORE CALCULATION
   ========================================= */

function getScore(
    game,
    category,
    player
) {

    const input =
        document.querySelector(
            `.score[data-game="${game}"][data-cat="${category}"][data-player="${player}"]`
        );


    if (
        !input ||
        input.value === ""
    ) {
        return 0;
    }


    const value =
        Number(input.value);


    if (
        !Number.isFinite(value) ||
        value < 0
    ) {
        return 0;
    }


    return value;
}


function getUpperTotal(
    game,
    player
) {

    return upperCategories.reduce(
        (sum, category) => {

            return sum +
                getScore(
                    game,
                    category.key,
                    player
                );

        },
        0
    );
}


/* =========================================
   NORMAL YATZY CALCULATION
   ========================================= */

function updateYatzy() {

    const totals = [0, 0];


    for (
        let player = 1;
        player <= 2;
        player++
    ) {

        const upper =
            getUpperTotal(
                "yatzy",
                player
            );


        const bonus =
            upper >= 63
                ? 50
                : 0;


        document.getElementById(
            `yatzyUpper${player}`
        ).textContent =
            upper;


        document.getElementById(
            `yatzyBonus${player}`
        ).textContent =
            bonus;


        let total =
            upper + bonus;


        yatzyLowerCategories
            .forEach(category => {

                total +=
                    getScore(
                        "yatzy",
                        category.key,
                        player
                    );
            });


        totals[player - 1] =
            total;


        document.getElementById(
            `yatzyTotal${player}`
        ).textContent =
            total;
    }


    updateWinner(
        "yatzyTotal1",
        "yatzyTotal2",
        totals
    );


    updateStickyTotals(
        totals[0],
        totals[1]
    );
}


/* =========================================
   MAX YATZY CALCULATION
   ========================================= */

function updateMax() {

    const totals = [0, 0];


    for (
        let player = 1;
        player <= 2;
        player++
    ) {

        const upper =
            getUpperTotal(
                "max",
                player
            );


        /*
         * Max Yatzy:
         * 75 or more in the upper section
         * gives 50 bonus points.
         */

        const bonus =
            upper >= 75
                ? 50
                : 0;


        document.getElementById(
            `maxUpper${player}`
        ).textContent =
            upper;


        document.getElementById(
            `maxBonus${player}`
        ).textContent =
            bonus;


        let total =
            upper + bonus;


        maxLowerCategories
            .forEach(category => {

                total +=
                    getScore(
                        "max",
                        category.key,
                        player
                    );
            });


        totals[player - 1] =
            total;


        document.getElementById(
            `maxTotal${player}`
        ).textContent =
            total;
    }


    updateWinner(
        "maxTotal1",
        "maxTotal2",
        totals
    );


    updateStickyTotals(
        totals[0],
        totals[1]
    );
}


/* =========================================
   WINNER / STICKY TOTAL
   ========================================= */

function updateWinner(
    id1,
    id2,
    totals
) {

    const total1 =
        document.getElementById(id1);

    const total2 =
        document.getElementById(id2);


    total1.classList.remove(
        "winner"
    );

    total2.classList.remove(
        "winner"
    );


    if (totals[0] > totals[1]) {

        total1.classList.add(
            "winner"
        );

    } else if (totals[1] > totals[0]) {

        total2.classList.add(
            "winner"
        );
    }
}


function updateStickyTotals(
    player1,
    player2
) {

    document.getElementById(
        "stickyTotal1"
    ).textContent =
        player1;


    document.getElementById(
        "stickyTotal2"
    ).textContent =
        player2;
}


/* =========================================
   GAME SWITCH
   ========================================= */

function setGame(game) {

    currentGame =
        game;


    const isMax =
        game === "max";


    document.getElementById(
        "yatzyBtn"
    ).classList.toggle(
        "active",
        !isMax
    );


    document.getElementById(
        "maxBtn"
    ).classList.toggle(
        "active",
        isMax
    );


    document.getElementById(
        "yatzyCard"
    ).classList.toggle(
        "hidden",
        isMax
    );


    document.getElementById(
        "maxCard"
    ).classList.toggle(
        "hidden",
        !isMax
    );


    /*
     * Re-roll controls only appear
     * when Max Yatzy is selected.
     */

    document.getElementById(
        "rerollArea1"
    ).classList.toggle(
        "hidden-reroll",
        !isMax
    );


    document.getElementById(
        "rerollArea2"
    ).classList.toggle(
        "hidden-reroll",
        !isMax
    );


    document.getElementById(
        "gameTitle"
    ).textContent =
        isMax
            ? "🎲 Max Yatzy"
            : "🎲 Yatzy";


    loadScoresForGame(game);

    update();
}


/* =========================================
   GENERAL UPDATE
   ========================================= */

function update() {

    if (currentGame === "max") {

        updateMax();

    } else {

        updateYatzy();
    }


    updateRerollDisplay();

    saveGame();
}


/* =========================================
   INPUT EVENTS
   ========================================= */

document.addEventListener(
    "input",
    event => {

        if (
            event.target.classList.contains(
                "score"
            )
        ) {
            update();
        }
    }
);


/* =========================================
   START APPLICATION
   ========================================= */

buildScorecards();

loadScoresForGame(
    currentGame
);

setGame(
    currentGame
);

updateRerollDisplay();

</script>
